// Interval bars: height = % FTP, color = zone. With `t`, the done part is opaque and a cursor marks now.
function drawSteps(cv, steps, t, pad = { l:0, r:0, t:2, b:0 }) {
  const [W, H] = [cv.clientWidth, cv.clientHeight], dpr = Math.min(devicePixelRatio, 2);
  cv.width = W * dpr; cv.height = H * dpr;
  const ctx = cv.getContext('2d');
  ctx.scale(dpr, dpr);
  const total = steps.reduce((a, s) => a + s.secs, 0), top = 130;
  const x = s => pad.l + s / total * (W - pad.l - pad.r), y = pct => H - pad.b - Math.min(pct, top) / top * (H - pad.t - pad.b);
  let at = 0;
  for (const s of steps) {
    const n = s.from === s.to ? 1 : Math.max(2, Math.round(s.secs / 30)); // ramps drawn as small stairs
    for (let k = 0; k < n; k++) {
      const [a, b] = [at + s.secs * k / n, at + s.secs * (k + 1) / n], pct = s.from + (s.to - s.from) * (k + 0.5) / n;
      ctx.globalAlpha = t == null || a < t ? 1 : 0.45;
      ctx.fillStyle = zoneColor(pct);
      ctx.fillRect(x(a), y(pct), x(b) - x(a) + 0.5, H - pad.b - y(pct));
    }
    at += s.secs;
  }
  ctx.globalAlpha = 1;
  if (t != null) {
    ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--ink');
    ctx.fillRect(x(Math.min(t, total)) - 1, pad.t, 3, H - pad.t - pad.b);
  }
  return { x, total };
}

function openWorkout(w) {
  ride.ended = false;
  amb.ctx ??= new AudioContext();
  amb.ctx.resume();
  ride.mode = 'workout';
  $('#leave').textContent = '‖ Pause';
  ride.workout = w;
  ride.course = null;
  show('#ride');
  $('#courseName').textContent = w.name;
  $('#attrib').textContent = `Cibles en % de ta FTP (${current.ftp} W). Sons : Wikimedia Commons et Freesound (domaine public, CC0).`;
  ride.state = null;
  ride.session = Math.floor(Math.random() * 2 ** 52);
  const demo = !ride.list?.trainer;
  $('#demo').hidden = !demo;
  $('#autoBtn').hidden = !demo;
  $('#profileCanvas').classList.remove('seekable');
  $('#profileCanvas').title = '';
  if (demo) setPower(Math.round(current.ftp * 0.5 / 5) * 5);
  renderStats();
  ride.events = new EventSource(`/events?workout=${w.id}&ftp=${current.ftp}&mass=${current.weightKg + 8}&session=${ride.session}`);
  ride.events.onmessage = e => {
    ride.state = JSON.parse(e.data);
    if (ride.auto && ride.state.workout && Math.round(ride.state.workout.target) !== +$('#watts').value) setPower(ride.state.workout.target);
    renderStats(); drawProfile(); mixAmbience(); checkEnd();
  };
  startAmbience().catch(() => {});
  resize();
}

// Zombie Halloween: a fresh flat 5 km loop, ridden with a horde on your wheel (game logic in src/zombie.rs).
async function openZombie() {
  const sub = $('#goZombieSub'), text = sub.textContent;
  sub.textContent = 'Les zombies se réveillent…';
  amb.ctx ??= new AudioContext(); // still inside the click
  try {
    const r = await fetch('/worlds/new?length=5&relief=flat');
    if (r.ok) await openRide((await r.json()).id, true, true);
  } finally {
    sub.textContent = text;
  }
}

async function openRide(id, hasTerrain, zombie = false) {
  ride.ended = false;
  amb.ctx ??= new AudioContext(); // created inside the click so autoplay policies allow sound
  amb.ctx.resume();
  ride.mode = zombie ? 'zombie' : 'course';
  ride.zombie = { prev:null, toast:'', toastUntil:0 };
  $('#leave').textContent = '‖ Pause';
  ride.course = await (await fetch(`/course?id=${encodeURIComponent(id)}`)).json();
  show('#ride');
  $('#courseName').textContent = zombie ? 'Zombie Halloween' : ride.course.name;
  $('#attrib').textContent = attribution();
  ride.state = null;
  renderStats();
  ride.session = Math.floor(Math.random() * 2 ** 52);
  const demo = !ride.list.trainer;
  $('#demo').hidden = !demo;
  $('#autoBtn').hidden = true;
  const seek = demo && !zombie; // no teleporting away from the horde
  $('#profileCanvas').classList.toggle('seekable', seek);
  $('#profileCanvas').title = seek ? 'Clique pour te placer sur le parcours' : '';
  if (demo) {
    setPower(Math.round(current.ftp * 0.75 / 5) * 5); // start at endurance pace
  }
  // ponytail: 8 kg bike until the garage has weights
  const me = `&name=${encodeURIComponent(current.name)}&color=${encodeURIComponent(current.bike.frame)}&frame=${current.bike.frameType ?? 'road'}&country=${current.country ?? ''}`;
  const game = zombie ? `&mode=zombie&ftp=${current.ftp}` : '';
  ride.events = new EventSource(`/events?course=${encodeURIComponent(id)}&mass=${current.weightKg + 8}&session=${ride.session}${me}${game}`);
  if (hasTerrain) {
    $('#attrib').textContent = 'Chargement du terrain…';
    const buf = await (await fetch(`/terrain?id=${encodeURIComponent(id)}`)).arrayBuffer();
    $('#attrib').textContent = attribution();
    if (!$('#ride').hidden) enter3d(buf);
  }
  ride.events.onmessage = e => { ride.state = JSON.parse(e.data); zombieNews(); renderStats(); drawProfile(); mixAmbience(); checkEnd() };
  startAmbience().catch(() => {}); // no sound is not worth an error
  resize();
}

function setPower(w) {
  w = Math.max(0, Math.min(+$('#watts').max, Math.round(w)));
  $('#watts').value = w;
  $('#wattsOut').textContent = `${w} W`;
  fetch(`/power?session=${ride.session}&w=${w}`).catch(() => {});
}
$('#watts').addEventListener('input', e => setPower(+e.target.value));
// Demo: click the profile to jump there.
$('#profileCanvas').addEventListener('click', e => {
  if ($('#demo').hidden || !profileLayout || ride.mode !== 'course') return;
  const { left, width, total } = profileLayout;
  const d = Math.max(0, Math.min(1, (e.offsetX - left) / width)) * total;
  fetch(`/seek?session=${ride.session}&d=${Math.round(d)}`).catch(() => {});
  w3.dist = d;
  w3.snap = true;
});
for (const b of document.querySelectorAll('[data-dw]')) b.addEventListener('click', () => setPower(+$('#watts').value + +b.dataset.dw));
addEventListener('keydown', e => {
  if ($('#ride').hidden || !$('#menu').hidden || $('#demo').hidden || e.target === $('#watts')) return;
  const dw = { ArrowUp:10, ArrowDown:-10 }[e.key];
  if (dw) { e.preventDefault(); setPower(+$('#watts').value + dw) }
});

// Zombie game news: turn changes between two frames into a short message under the stats.
const BONUS_NEWS = {
  pumpkin:'Citrouille à l\'ail ! La horde recule de 60 m',
  boost:'Turbo ! Tu files 50 % plus vite qu\'elle pendant 10 s',
  shield:'Bouclier : tu survivras à la prochaine morsure',
};
function zombieNews() {
  const z = ride.state?.zombie, prev = ride.zombie?.prev;
  if (!z) return;
  ride.zombie.prev = z;
  if (!prev) return;
  const say = text => Object.assign(ride.zombie, { toast:text, toastUntil:performance.now() + 4000 });
  if (z.picked > prev.picked) say(BONUS_NEWS[prev.bonus]);
  if (prev.shield && !z.shield && !z.over) say('Le bouclier t\'a sauvé, la horde recule !');
  if (prev.sprint && !z.sprint) say(z.sprints_won > prev.sprints_won ? 'Sprint gagné ! La horde recule de 100 m' : 'Sprint raté… elle se rapproche');
  if (z.wave > prev.wave) say(`Vague ${z.wave} : la horde accélère !`);
}

function renderStats() {
  const s = ride.state ?? { power:0, speed_kmh:0, grade:0, distance:0, ele:ride.course?.points[0].ele ?? 0, elapsed:0 };
  const t = Math.floor(s.elapsed), hms = `${Math.floor(t / 3600)}:${String(Math.floor(t / 60) % 60).padStart(2, '0')}:${String(t % 60).padStart(2, '0')}`;
  const stat = (label, value, unit) => h('div', { class:'stat' }, h('small', {}, label), h('b', {}, value), h('i', {}, unit));
  if (ride.mode === 'workout') {
    const w = s.workout ?? { target:0, step_left:ride.workout.steps[0].secs, done:false };
    const total = ride.workout.steps.reduce((a, st) => a + st.secs, 0);
    $('#stats').replaceChildren(
      stat('Puissance', Math.round(s.power), 'W'),
      stat('Cible', Math.round(w.target), 'W'),
      stat('Intervalle', mmss(w.step_left), ''),
      stat('Séance', mmss(Math.min(s.elapsed, total)), `/ ${mmss(total)}`),
      stat('Vitesse', s.speed_kmh.toFixed(1), 'km/h'),
      stat('Distance', (s.distance / 1000).toFixed(2), 'km'),
      ...(w.done ? [h('div', { class:'finish' }, 'Séance terminée, bravo !')] : s.elapsed === 0 ? [h('div', { class:'finish' }, 'Pédale pour lancer la séance')] : []),
    );
    return;
  }
  if (ride.mode === 'zombie') {
    const z = s.zombie ?? { gap:150, wave:1, horde_kmh:0, sprint:null, next_sprint:45, sprints:0, sprints_won:0, boost_left:0, shield:false, over:false };
    const line = z.over ? `Les zombies t'ont rattrapé après ${hms} !`
      : z.sprint ? `SPRINT ! ${Math.round(z.sprint.target)} W · tenu ${Math.floor(z.sprint.held)}/${z.sprint.need} s · reste ${Math.ceil(z.sprint.left)} s`
      : performance.now() < ride.zombie.toastUntil ? ride.zombie.toast
      : s.elapsed === 0 ? 'Pédale, la horde arrive !'
      : `Prochain sprint dans ${Math.max(0, Math.ceil(z.next_sprint - s.elapsed))} s`;
    $('#stats').replaceChildren(
      stat('Puissance', Math.round(s.power), 'W'),
      stat('Vitesse', s.speed_kmh.toFixed(1), 'km/h'),
      stat('Horde', Math.round(z.gap), `m${z.shield ? ' 🛡' : ''}${z.boost_left > 0 ? ' ⚡' : ''}`),
      stat(`Vague ${z.wave}`, Math.round(z.horde_kmh), 'km/h'),
      stat('Survie', hms, ''),
      stat('Sprints', z.sprints_won, `/ ${z.sprints}`),
      h('div', { class:`finish zombie-hud${z.sprint ? ' sprint' : ''}`, 'aria-live':'polite' }, line),
    );
    return;
  }
  const total = ride.course.points.at(-1).d;
  $('#stats').replaceChildren(
    stat('Puissance', Math.round(s.power), 'W'),
    stat('Vitesse', s.speed_kmh.toFixed(1), 'km/h'),
    stat('Pente', s.grade.toFixed(1), '%'),
    ride.course.looped
      ? stat(`Tour ${(s.laps ?? 0) + 1}`, (s.distance / 1000).toFixed(2), `/ ${(total / 1000).toFixed(1)} km`)
      : stat('Distance', (s.distance / 1000).toFixed(2), `/ ${(total / 1000).toFixed(1)} km`),
    stat('Altitude', Math.round(s.ele), 'm'),
    stat('Temps', hms, ''),
    ...(s.finished ? [h('div', { class:'finish' }, `Arrivée en ${hms} !`)] : []),
  );
}

let profileLayout = null;
function drawProfile() {
  if (ride.mode === 'workout') {
    drawSteps($('#profileCanvas'), ride.workout.steps, ride.state?.elapsed ?? 0, { l:8, r:8, t:8, b:8 });
    return;
  }
  const cv = $('#profileCanvas'), dpr = Math.min(devicePixelRatio, 2);
  const [W, H] = [cv.clientWidth, cv.clientHeight];
  cv.width = W * dpr; cv.height = H * dpr;
  const ctx = cv.getContext('2d');
  ctx.scale(dpr, dpr);
  const pts = ride.course.points, total = pts.at(-1).d;
  const lo = Math.min(...pts.map(p => p.ele)), hi = Math.max(...pts.map(p => p.ele));
  const pad = { l:60, r:8, t:8, b:18 };
  const x = d => pad.l + d / total * (W - pad.l - pad.r);
  profileLayout = { left:pad.l, width:W - pad.l - pad.r, total };
  const y = e => H - pad.b - (e - lo) / (hi - lo || 1) * (H - pad.t - pad.b);
  const pos = ride.state?.distance ?? 0;
  // One column per 250 m, colored by its grade; ridden part fully opaque.
  for (let i = 0; i < pts.length - 1; i += 25) {
    const [a, b] = [pts[i], pts[Math.min(i + 25, pts.length - 1)]];
    ctx.globalAlpha = a.d < pos ? 1 : 0.55;
    ctx.fillStyle = gradeColor((b.ele - a.ele) / (b.d - a.d) * 100);
    ctx.beginPath();
    ctx.moveTo(x(a.d), H - pad.b); ctx.lineTo(x(a.d), y(a.ele)); ctx.lineTo(x(b.d), y(b.ele)); ctx.lineTo(x(b.d), H - pad.b);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--muted');
  ctx.font = '11px Silkscreen, monospace';
  ctx.textAlign = 'right';
  ctx.fillText(`${Math.round(hi)} m`, pad.l - 6, pad.t + 8);
  ctx.fillText(`${Math.round(lo)} m`, pad.l - 6, H - pad.b);
  ctx.textAlign = 'center';
  for (let km = 0; km <= total / 1000; km += 2) ctx.fillText(`${km}`, x(km * 1000), H - 4);
  // Other riders: small bricks in their frame color.
  for (const o of ride.state?.others ?? []) {
    const oe = pts[Math.min(pts.length - 1, Math.round(o.distance / 10))].ele;
    ctx.fillStyle = o.color;
    ctx.fillRect(x(o.distance) - 4, y(oe) - 10, 8, 8);
  }
  // Rider marker: a little yellow brick.
  const ele = pts[Math.min(pts.length - 1, Math.round(pos / 10))].ele;
  ctx.fillStyle = '#f2cd37';
  ctx.strokeStyle = '#0b0d10';
  ctx.lineWidth = 2;
  ctx.fillRect(x(pos) - 6, y(ele) - 14, 12, 12);
  ctx.strokeRect(x(pos) - 6, y(ele) - 14, 12, 12);
  // Zombie game (always on a loop): the horde behind, the next bonus ahead.
  const z = ride.state?.zombie;
  if (z) {
    const mark = (d, color) => {
      d = ((d % total) + total) % total;
      const e = pts[Math.min(pts.length - 1, Math.round(d / 10))].ele;
      ctx.fillStyle = color;
      ctx.fillRect(x(d) - 5, y(e) - 12, 10, 10);
      ctx.strokeRect(x(d) - 5, y(e) - 12, 10, 10);
    };
    mark(pos + z.bonus_at - ride.state.ridden, BONUS_COLORS[z.bonus]);
    mark(pos - z.gap, '#5d9b3a');
  }
}

// ---------- 3D course world (terrain from `le-mollet course` / `le-mollet terrain`) ----------
const COVER = { GRASS:0, FOREST:1, WATER:2, BUILDING:3, ROCK:4, ROAD:5 };
const STEP_Y = 2;          // voxel height, m. Calibration knob: smaller = finer terraces
const CHUNK = 64;          // cells per chunk side (5 m cells = 320 m)
// ponytail: fixed view distance by screen width; measure fps on real devices before tuning
const CHUNK_RADIUS = innerWidth <= 700 ? 2 : 3;
const BIKE_SCALE = 0.037;  // one garage voxel = 37 mm
const w3 = { T:null, group:null, chunks:new Map(), others:new Map(), bike:null, eagle:null, dist:0, look:new THREE.Vector3(), snap:false, saved:null };
const terrainMat = new THREE.MeshLambertMaterial({ vertexColors:true, side:THREE.DoubleSide });

function parseTerrain(buf, course) {
  const dv = new DataView(buf);
  const w = dv.getUint32(0, true), h = dv.getUint32(4, true);
  const [west, south, east, north] = [8, 16, 24, 32].map(o => dv.getFloat64(o, true));
  const heights = new Uint16Array(buf, 40, w * h);
  const cover = new Uint8Array(buf, 40 + w * h * 2, w * h);
  const p0 = course.points[0];
  const kx = Math.cos(p0.lat * Math.PI / 180) * 111320, kz = 110540;
  const toXZ = (lat, lon) => [(lon - p0.lon) * kx, (p0.lat - lat) * kz]; // x east, z south, meters
  const [ox, oz] = toXZ(north, west);
  const ele = i => heights[i] / 10;
  const top = (c, r) => {
    const i = r * w + c;
    return Math.floor(ele(i) / STEP_Y) * STEP_Y + (cover[i] === COVER.BUILDING ? 6 : 0);
  };
  return { w, h, cover, ele, top, toXZ, ox, oz, cx:(east - west) / w * kx, cz:(north - south) / h * kz };
}

function topColor(cov, e) {
  if (cov === COVER.ROAD) return '#5a5f66';
  if (cov === COVER.WATER) return '#3b7dd8';
  if (cov === COVER.BUILDING) return '#b5523b';
  if (cov === COVER.ROCK || e > 2400) return e > 2800 ? '#f4f4f4' : '#a3a39b';
  return cov === COVER.FOREST ? '#3f7a2c' : '#6aa84f';
}
const sideColor = (cov, e) => cov === COVER.BUILDING ? '#e6d9b8' : cov === COVER.ROCK || e > 2400 ? '#7d7d76' : '#7a4f2e';
const shade = (hex, c, r) => new THREE.Color(hex).offsetHSL(0, 0, (hash(c, r, 7) - 0.5) * 0.07);
const TRUNK = new THREE.Color('#5b3a1e'), LEAVES = '#2f6b24';

// Wildlife from land cover and altitude. Deterministic per cell, so what you see is what you hear.
// ponytail: toy scale (1.5x cows, ~2x others) so they read at chase-cam distance; real size is invisible
const ANIMALS = {
  cow:     { len:3.0, h:1.5, w:1.2, leg:1.0, body:'#f4f4f4', patch:'#1b2a34', head:'#f4f4f4' },
  deer:    { len:2.2, h:1.1, w:0.8, leg:1.4, body:'#8b5a2b', head:'#7a4a22' },
  chamois: { len:2.0, h:1.0, w:0.7, leg:1.1, body:'#5b4330', head:'#e8dcc0', horns:true },
  marmot:  { upright:true, len:0.6, h:0.9, w:0.5, body:'#9a7346', head:'#7a5a36' },
};
function animalAt(T, c, r) {
  if (c < 1 || r < 1 || c >= T.w - 1 || r >= T.h - 1) return null;
  const i = r * T.w + c, cov = T.cover[i], e = T.ele(i), h = hash(c, r, 3);
  const flat = Math.abs(T.ele(i + 1) - T.ele(i - 1)) < 4 && Math.abs(T.ele(i + T.w) - T.ele(i - T.w)) < 4; // under ~22°
  // Cows graze in herds: 12 % of 40 m blocks hold one.
  if (cov === COVER.GRASS && e > 900 && e < 2300 && flat && hash(c >> 3, r >> 3, 11) < 0.12 && h < 0.04) return 'cow';
  if ((cov === COVER.GRASS || cov === COVER.ROCK) && e > 1600 && e < 2800 && h < 0.006) return 'marmot';
  if (cov === COVER.ROCK && e > 1500 && h < 0.002) return 'chamois';
  if (cov === COVER.FOREST && e < 1800 && h < 0.004 && [1, -1, T.w, -T.w].some(o => T.cover[i + o] === COVER.GRASS)) return 'deer';
  return null;
}

function chunkMesh(T, ci, cj) {
  const pos = [], col = [];
  const quad = (pts, c) => { for (const i of [0, 1, 2, 0, 2, 3]) pos.push(...pts[i]); for (let k = 0; k < 6; k++) col.push(c.r, c.g, c.b) };
  const box = (x, y, z, sx, sy, sz, c) => {
    const [a, b, d, e, lo, hi] = [x - sx / 2, x + sx / 2, z - sz / 2, z + sz / 2, y, y + sy];
    quad([[a, hi, d], [a, hi, e], [b, hi, e], [b, hi, d]], c);
    quad([[a, lo, d], [b, lo, d], [b, hi, d], [a, hi, d]], c);
    quad([[a, lo, e], [a, hi, e], [b, hi, e], [b, lo, e]], c);
    quad([[a, lo, d], [a, hi, d], [a, hi, e], [a, lo, e]], c);
    quad([[b, lo, d], [b, lo, e], [b, hi, e], [b, hi, d]], c);
  };
  const beast = (a, x, y, z, alongX) => {
    const C = k => new THREE.Color(a[k]);
    if (a.upright) { // marmot on sentry duty
      box(x, y, z, a.len, a.h, a.w, C('body'));
      box(x, y + a.h, z, a.len * 0.75, a.h * 0.45, a.w * 0.8, C('head'));
      return;
    }
    const [L, W, fx, fz] = alongX ? [a.len, a.w, 1, 0] : [a.w, a.len, 0, 1]; // x size, z size, facing
    const [leg, head] = [a.w * 0.25, a.h * 0.6];
    for (const [sx, sz] of [[1, 1], [1, -1], [-1, 1], [-1, -1]]) box(x + sx * (L - leg) / 2, y, z + sz * (W - leg) / 2, leg, a.leg, leg, C('body'));
    box(x, y + a.leg, z, L, a.h, W, C('body'));
    if (a.patch) box(x - fx * a.len * 0.1, y + a.leg + a.h * 0.25, z - fz * a.len * 0.1, alongX ? a.len * 0.3 : L + 0.05, a.h * 0.5, alongX ? W + 0.05 : a.len * 0.3, C('patch'));
    const [hx, hz, hy] = [x + fx * (a.len + head) / 2, z + fz * (a.len + head) / 2, y + a.leg + a.h * 0.6];
    box(hx, hy, hz, head, head, head * 0.9, C('head'));
    if (a.horns) box(hx, hy + head, hz, head * 0.2, head * 0.6, head * 0.6, new THREE.Color('#1b2a34'));
  };
  const top = (c, r) => c < 0 || r < 0 || c >= T.w || r >= T.h ? -Infinity : T.top(c, r);
  for (let r = cj * CHUNK; r < Math.min((cj + 1) * CHUNK, T.h); r++) {
    for (let c = ci * CHUNK; c < Math.min((ci + 1) * CHUNK, T.w); c++) {
      const i = r * T.w + c, cov = T.cover[i], e = T.ele(i), y = top(c, r);
      const x0 = T.ox + c * T.cx, x1 = x0 + T.cx, z0 = T.oz + r * T.cz, z1 = z0 + T.cz;
      quad([[x0, y, z0], [x0, y, z1], [x1, y, z1], [x1, y, z0]], shade(topColor(cov, e), c, r));
      const sc = shade(sideColor(cov, e), c, r);
      for (const [dc, dr, [ax, az], [bx, bz]] of [[1, 0, [x1, z0], [x1, z1]], [-1, 0, [x0, z0], [x0, z1]], [0, 1, [x0, z1], [x1, z1]], [0, -1, [x0, z0], [x1, z0]]]) {
        const n = Math.max(top(c + dc, r + dr), y - 40);
        if (n < y) quad([[ax, y, az], [ax, n, az], [bx, n, bz], [bx, y, bz]], sc);
      }
      const kind = animalAt(T, c, r);
      if (kind) beast(ANIMALS[kind], (x0 + x1) / 2, y, (z0 + z1) / 2, hash(c, r, 5) < 0.5);
      if (cov === COVER.FOREST && e < 2000 && hash(c, r, 1) < 0.3) {
        const [tx, tz] = [(x0 + x1) / 2, (z0 + z1) / 2];
        box(tx, y, tz, 0.8, 3, 0.8, TRUNK);
        box(tx, y + 3, tz, 4, 4, 4, shade(LEAVES, c, r));
      }
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  g.computeVertexNormals();
  return new THREE.Mesh(g, terrainMat);
}

// Whole area at 40 m for distant mountains, sunk below the voxels it underlies.
function farMesh(T) {
  const F = 8, W = Math.floor((T.w - 1) / F) + 1, H = Math.floor((T.h - 1) / F) + 1;
  const pos = new Float32Array(W * H * 3), col = new Float32Array(W * H * 3), idx = [], c3 = new THREE.Color();
  for (let j = 0; j < H; j++) for (let i = 0; i < W; i++) {
    const [c, r, k] = [i * F, j * F, (j * W + i) * 3], e = T.ele(r * T.w + c);
    pos.set([T.ox + (c + 0.5) * T.cx, e - 15, T.oz + (r + 0.5) * T.cz], k);
    c3.set(topColor(T.cover[r * T.w + c], e));
    col.set([c3.r, c3.g, c3.b], k);
  }
  for (let j = 0; j < H - 1; j++) for (let i = 0; i < W - 1; i++) {
    const a = j * W + i;
    idx.push(a, a + W, a + 1, a + 1, a + W, a + W + 1);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  g.setIndex(idx);
  g.computeVertexNormals();
  return new THREE.Mesh(g, new THREE.MeshLambertMaterial({ vertexColors:true, flatShading:true }));
}

// Smooth asphalt ribbon on the course's smoothed elevation, with skirts down to the voxels.
function roadMesh(course, T) {
  const P = course.points.map(p => { const [x, z] = T.toXZ(p.lat, p.lon); return [x, p.ele + 0.2, z] });
  const pos = [], col = [], asphalt = new THREE.Color('#4a4f55'), skirt = new THREE.Color('#3a3f44'), paint = new THREE.Color('#f4f4f4');
  const quad = (pts, c) => { for (const i of [0, 1, 2, 0, 2, 3]) pos.push(...pts[i]); for (let k = 0; k < 6; k++) col.push(c.r, c.g, c.b) };
  const side = i => {
    const [a, b] = [P[Math.max(0, i - 1)], P[Math.min(P.length - 1, i + 1)]];
    const [dx, dz] = [b[0] - a[0], b[2] - a[2]], n = Math.hypot(dx, dz) || 1;
    return [-dz / n, dx / n];
  };
  const off = (i, d, dy = 0) => { const [sx, sz] = side(i); return [P[i][0] + sx * d, P[i][1] + dy, P[i][2] + sz * d] };
  for (let i = 0; i < P.length - 1; i++) {
    quad([off(i, -3), off(i, 3), off(i + 1, 3), off(i + 1, -3)], asphalt);
    quad([off(i, 3), off(i, 3, -4), off(i + 1, 3, -4), off(i + 1, 3)], skirt);
    quad([off(i, -3), off(i, -3, -4), off(i + 1, -3, -4), off(i + 1, -3)], skirt);
    if (i % 2 === 0) quad([off(i, -0.08, 0.02), off(i, 0.08, 0.02), off(i + 1, 0.08, 0.02), off(i + 1, -0.08, 0.02)], paint);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  g.computeVertexNormals();
  return new THREE.Mesh(g, terrainMat);
}

function pointAt(d) {
  const p = ride.course.points, len = p.at(-1).d;
  d = ride.course.looped ? ((d % len) + len) % len : Math.max(0, Math.min(len, d));
  let i = Math.min(p.length - 2, Math.floor(d / 10));
  while (i > 0 && p[i].d > d) i--;
  while (i < p.length - 2 && p[i + 1].d < d) i++;
  const t = (d - p[i].d) / (p[i + 1].d - p[i].d);
  const [x, z] = w3.T.toXZ(p[i].lat + (p[i + 1].lat - p[i].lat) * t, p[i].lon + (p[i + 1].lon - p[i].lon) * t);
  return new THREE.Vector3(x, p[i].ele + (p[i + 1].ele - p[i].ele) * t + 0.2, z);
}

// Smoothly follow a server distance (3 updates/s): extrapolate with speed, ease toward the truth,
// and on a loop take the short way round when the reported distance wraps past the line.
function follow(shown, reported, speedKmh, dt) {
  const len = ride.course.points.at(-1).d;
  if (ride.course.looped) {
    if (reported - shown > len / 2) shown += len;
    else if (shown - reported > len / 2) shown -= len;
  }
  shown += speedKmh / 3.6 * dt;
  return shown + (reported - shown) * Math.min(1, dt * 2);
}

function riderModel(bike) {
  const inner = new THREE.Group();
  if (bike.style === 'lowpoly') inner.add(lowpolyBike({ ...bike, rider:true }));
  else inner.add(...instanced(bikeVoxels({ ...bike, rider:true }), bike.style, false));
  inner.position.set(-14, 9.5, 0); // wheelbase centered, tires on the road
  const g = new THREE.Group();
  g.add(inner);
  g.scale.setScalar(BIKE_SCALE);
  g.rotation.order = 'YZX';
  return g;
}

function nameTag(text) {
  const c = document.createElement('canvas');
  [c.width, c.height] = [256, 56];
  const g = c.getContext('2d');
  g.fillStyle = 'rgba(11,13,16,.75)';
  g.fillRect(0, 0, 256, 56);
  g.fillStyle = '#eef1f5';
  g.font = 'bold 26px Silkscreen, monospace';
  g.textAlign = 'center';
  g.textBaseline = 'middle';
  g.fillText(text, 128, 30, 244);
  const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map:new THREE.CanvasTexture(c), transparent:true }));
  sprite.scale.set(2.6, 0.57, 1);
  sprite.position.y = 2.4;
  return sprite;
}

// Other riders on the same course: their bike in their frame color, a name tag, spread across the road.
function updateOthers(dt) {
  const seen = new Set();
  for (const o of ride.state?.others ?? []) {
    seen.add(o.id);
    let r = w3.others.get(o.id);
    if (!r) {
      const holder = new THREE.Group(), bike = riderModel({ ...DEFAULT_BIKE, style:current.bike.style, frame:o.color, frameType:o.frame });
      holder.add(bike, nameTag(`${o.name}${o.country ? ' ' + flag(o.country) : ''}`));
      w3.group.add(holder);
      r = { holder, bike, dist:o.distance, lane:(hash(o.id % 100000, 1, 9) - 0.5) * 3 };
      w3.others.set(o.id, r);
    }
    r.dist = follow(r.dist, o.distance, o.speed_kmh, dt);
    const p = pointAt(r.dist), dir = pointAt(r.dist + 8).sub(pointAt(r.dist - 8));
    dir.y = 0;
    dir.normalize();
    r.holder.position.set(p.x - dir.z * r.lane, p.y, p.z + dir.x * r.lane);
    r.bike.rotation.set(0, Math.atan2(-dir.z, dir.x), 0);
  }
  for (const [id, r] of w3.others) {
    if (seen.has(id)) continue;
    w3.group.remove(r.holder);
    r.holder.traverse(o => { o.geometry?.dispose(); o.material?.map?.dispose(); o.material?.dispose() });
    w3.others.delete(id);
  }
}

function enter3d(buf) {
  w3.T = parseTerrain(buf, ride.course);
  w3.group = new THREE.Group();
  w3.group.add(farMesh(w3.T), roadMesh(ride.course, w3.T));
  w3.bike = riderModel(current.bike);
  w3.group.add(w3.bike);
  // A raptor circling above the high mountain.
  const brown = new THREE.MeshLambertMaterial({ color:'#5b3a1e' });
  w3.eagle = new THREE.Group();
  for (const [sx, sy, sz, x] of [[0.9, 0.25, 0.3, 0], [0.3, 0.06, 2.2, 0], [0.25, 0.05, 0.5, -0.5]]) {
    const b = new THREE.Mesh(new THREE.BoxGeometry(sx, sy, sz), brown);
    b.position.x = x;
    w3.eagle.add(b);
  }
  w3.eagle.scale.setScalar(2);
  w3.eagle.rotation.order = 'YXZ';
  w3.group.add(w3.eagle);
  scene.add(w3.group);
  world.visible = false;
  w3.saved = { near:camera.near, far:camera.far, fov:camera.fov };
  menuBg.visible = false;
  if (ride.mode === 'zombie') halloween();
  nightSky();
  camera.near = 0.3; camera.far = 12000; camera.fov = 60;
  sun.castShadow = false;
  controls.enabled = false;
  w3.dist = ride.state?.distance ?? 0;
  w3.snap = true;
  $('#ride').classList.add('world3d');
  resize();
}

function exit3d() {
  if (!w3.group) return;
  scene.remove(w3.group);
  w3.group.traverse(o => { o.geometry?.dispose(); if (o.material !== terrainMat) o.material?.dispose() });
  Object.assign(w3, { group:null, T:null, bike:null, eagle:null, horde:null, bonus:null, mirror:null, sky:null, lamp:null });
  $('#mirror').hidden = true;
  renderNight();
  w3.chunks.clear();
  w3.others.clear();
  $('#ride').classList.remove('world3d');
  world.visible = true;
  menuSky();
  camera.near = w3.saved.near; camera.far = w3.saved.far; camera.fov = w3.saved.fov;
  camera.position.set(36, 22, 84); // frames bike + rider (head ~27 voxels up)
  controls.target.set(0, 7, 0);
  camera.lookAt(controls.target);
  sun.castShadow = true;
  controls.enabled = true;
  resize();
}

// ---------- Night ride: stars and moon around the camera, moonlight, a headlamp on the bike ----------
let night = (() => { try { return localStorage.getItem('lemollet.night') === '1' } catch { return false } })();

function nightSky() {
  w3.sky = new THREE.Group();
  w3.sky.add(starField(1500, 5000)); // follows the camera so it never gets closer
  const moon = new THREE.Mesh(new THREE.SphereGeometry(140, 16, 12), new THREE.MeshBasicMaterial({ color:'#f4f1de', fog:false }));
  moon.position.set(-2600, 2400, -3000);
  w3.sky.add(moon);
  w3.group.add(w3.sky);
  // Headlamp: the bike model faces +x.
  w3.lamp = new THREE.SpotLight('#fff3d0', 900, 140, 0.45, 0.8);
  w3.lamp.position.set(0.8, 1.2, 0);
  w3.lamp.target.position.set(40, 0.5, 0);
  w3.bike.add(w3.lamp, w3.lamp.target);
  setNight();
}

function setNight() {
  if (!w3.sky) return renderNight();
  w3.sky.visible = w3.lamp.visible = night && ride.mode !== 'zombie';
  if (ride.mode === 'zombie') return renderNight();
  if (night) setSky('night', 60, 1500);
  else setSky('day', 900, 5000);
  renderNight();
}

function renderNight() {
  $('#night').hidden = !w3.sky || ride.mode === 'zombie';
  $('#night').textContent = night ? '☀ jour' : '☾ nuit';
  $('#night').setAttribute('aria-pressed', night);
}
$('#night').addEventListener('click', () => {
  night = !night;
  try { localStorage.setItem('lemollet.night', night ? '1' : '0') } catch {}
  setNight();
});

// ---------- Zombie Halloween in 3D: dusk, pumpkins along the road, the horde, the next bonus ----------
const ZOMBIE_MAX = 30;
const BONUS_COLORS = { pumpkin:'#fe8a18', boost:'#f2cd37', shield:'#36aebf' };

function halloween() {
  scene.background = new THREE.Color('#2b1430');
  scene.fog = new THREE.Fog('#b4501c', 40, 650);
  hemi.color.set('#ffb36b'); hemi.groundColor.set('#24123a'); hemi.intensity = 0.9;
  sun.color.set('#ff7a2a'); sun.intensity = 1.2;
  const unit = new THREE.BoxGeometry(1, 1, 1);
  const mat = (color, emissive = '#000000') => new THREE.MeshLambertMaterial({ color, emissive });
  const box = (parent, m, [sx, sy, sz], [x, y, z]) => {
    const b = new THREE.Mesh(unit, m);
    b.scale.set(sx, sy, sz);
    b.position.set(x, y, z);
    parent.add(b);
    return b;
  };

  // Glowing pumpkins on alternate sides of the road, every 40 m.
  const len = ride.course.points.at(-1).d, n = Math.floor(len / 40);
  const pumpkins = new THREE.InstancedMesh(unit, mat('#fe8a18', '#8a3200'), n), stems = new THREE.InstancedMesh(unit, mat('#237841'), n);
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), stem = new THREE.Vector3(0.15, 0.25, 0.15);
  for (let i = 0; i < n; i++) {
    const d = i * 40, p = pointAt(d), dir = pointAt(d + 5).sub(pointAt(d - 5));
    dir.y = 0;
    dir.normalize();
    const side = (i % 2 ? 1 : -1) * (4.5 + hash(i, 4, 2) * 3), s = 0.7 + hash(i, 5, 2) * 0.5;
    const at = new THREE.Vector3(p.x - dir.z * side, p.y - 0.2 + s / 2, p.z + dir.x * side);
    pumpkins.setMatrixAt(i, m.compose(at, q, new THREE.Vector3(s * 1.2, s, s * 1.2)));
    stems.setMatrixAt(i, m.compose(at.setY(at.y + s / 2 + 0.12), q, stem));
  }
  w3.group.add(pumpkins, stems);

  // The horde: voxel walkers facing +x like the bike, arms straight out. How many show depends on the wave.
  const [skin, shirt, pants, eye] = [mat('#7fbf3f'), mat('#5b3a6b'), mat('#2f2f55'), mat('#ff2a1a', '#ff2a1a')];
  w3.horde = Array.from({ length:ZOMBIE_MAX }, (_, i) => {
    const g = new THREE.Group();
    const legs = [-0.15, 0.15].map(z => {
      const hip = new THREE.Group(); // swing from the hip
      hip.position.set(0, 0.8, z);
      box(hip, pants, [0.25, 0.8, 0.25], [0, -0.4, 0]);
      g.add(hip);
      return hip;
    });
    box(g, shirt, [0.35, 0.7, 0.6], [0, 1.15, 0]);
    for (const z of [-0.4, 0.4]) box(g, skin, [0.75, 0.2, 0.2], [0.35, 1.38, z]);
    box(g, skin, [0.42, 0.42, 0.42], [0.03, 1.72, 0]);
    for (const z of [-0.1, 0.1]) box(g, eye, [0.04, 0.08, 0.08], [0.25, 1.78, z]);
    g.rotation.order = 'YZX';
    w3.group.add(g);
    // Front row first, then a ragged column behind, spread across the road.
    return { g, legs, back:i * 1.4 + hash(i, 8, 1) * 1.5, lane:(hash(i, 9, 1) - 0.5) * 5.5, phase:hash(i, 3, 1) * 6 };
  });
  w3.gap = ride.state?.zombie?.gap ?? 150;

  // The next bonus: one floating block per kind, the current one shown.
  // Narrow lens so a horde 100 m back is still a few pixels tall.
  w3.mirror = new THREE.PerspectiveCamera(22, 1.8, 0.3, 3000);
  $('#mirror').hidden = false;

  w3.bonus = new THREE.Group();
  for (const [kind, color] of Object.entries(BONUS_COLORS)) box(w3.bonus, mat(color, color), [1, 1, 1], [0, 0, 0]).name = kind;
  w3.group.add(w3.bonus);
}

function updateHorde(dt) {
  const z = ride.state?.zombie, t = clock.elapsedTime;
  if (!z) return;
  w3.gap += (z.gap - w3.gap) * Math.min(1, dt * 2);
  const shown = Math.min(ZOMBIE_MAX, 2 + z.wave * 2);
  w3.horde.forEach((m, i) => {
    m.g.visible = i < shown;
    if (!m.g.visible) return;
    const d = w3.dist - w3.gap - m.back, p = pointAt(d), dir = pointAt(d + 8).sub(pointAt(d - 8));
    dir.y = 0;
    dir.normalize();
    const step = Math.sin(t * 6 + m.phase);
    m.g.position.set(p.x - dir.z * m.lane, p.y - 0.2 + Math.abs(step) * 0.08, p.z + dir.x * m.lane);
    m.g.rotation.set(0, Math.atan2(-dir.z, dir.x), Math.sin(t * 3 + m.phase) * 0.08); // shamble
    m.legs[0].rotation.z = step * 0.5;
    m.legs[1].rotation.z = -step * 0.5;
  });
  // Bonus floats over the road ahead; it jumps further on once picked up.
  const ahead = z.bonus_at - (ride.state.ridden ?? 0);
  w3.bonus.visible = ahead > 0 && ahead < 500;
  for (const c of w3.bonus.children) c.visible = c.name === z.bonus;
  const b = pointAt(ride.state.distance + ahead); // same frame as `ridden`: no jitter
  w3.bonus.position.set(b.x, b.y + 1.2 + Math.sin(t * 3) * 0.25, b.z);
  w3.bonus.rotation.y += dt * 2;
  // The chase cam looks ahead: a rear-view mirror shows the horde coming.
  const p = w3.bike.position, dir = pointAt(w3.dist + 8).sub(pointAt(w3.dist - 8));
  dir.y = 0;
  dir.normalize();
  w3.mirror.position.copy(p).addScaledVector(dir, -1).setY(p.y + 2.2);
  w3.mirror.lookAt(p.x - dir.x * 60, p.y + 1, p.z - dir.z * 60);
}

// Mirror viewport over the #mirror frame, drawn after the main view.
function renderMirror() {
  const r = $('#mirror').getBoundingClientRect(), [x, y, w, h] = [r.left + 3, innerHeight - r.bottom + 3, r.width - 6, r.height - 6];
  w3.mirror.aspect = w / h;
  w3.mirror.updateProjectionMatrix();
  renderer.setScissorTest(true);
  renderer.setScissor(x, y, w, h);
  renderer.setViewport(x, y, w, h);
  renderer.render(scene, w3.mirror);
  renderer.setScissorTest(false);
  renderer.setViewport(0, 0, innerWidth, innerHeight);
}

function update3d(dt) {
  const s = ride.state, T = w3.T;
  // Extrapolate between server updates (~3 per second), then ease toward the server distance.
  w3.dist = follow(w3.dist, s?.distance ?? 0, s?.speed_kmh ?? 0, dt);
  const p = pointAt(w3.dist), dir = pointAt(w3.dist + 8).sub(pointAt(w3.dist - 8));
  dir.y = 0;
  dir.normalize();
  w3.bike.position.copy(p);
  w3.bike.rotation.set(0, Math.atan2(-dir.z, dir.x), Math.atan((s?.grade ?? 0) / 100));
  w3.bike.children[0].children[0]?.userData.tick?.(dt, s?.cadence ?? (s?.speed_kmh ?? 0) * 3); // low-poly legs: ~90 rpm at 30 km/h without a cadence sensor
  // Chase cam: rider in the lower third, horizon visible (60° FOV, see enter3d).
  const want = p.clone().addScaledVector(dir, -8).add(new THREE.Vector3(0, 2.5, 0));
  const look = p.clone().addScaledVector(dir, 10).add(new THREE.Vector3(0, 0.5, 0));
  const k = w3.snap ? 1 : 1 - Math.exp(-dt * 3);
  camera.position.lerp(want, k);
  w3.look.lerp(look, k);
  camera.lookAt(w3.look);
  w3.snap = false;
  const a = (w3.eagleAngle = (w3.eagleAngle ?? 0) + dt * 0.25);
  w3.eagle.visible = (s?.ele ?? 0) > 1400 && !w3.sky?.visible;
  if (w3.sky?.visible) w3.sky.position.copy(camera.position);
  // Circles 60 m ahead of the rider, 15 m up, so the chase cam catches it under the stats bar.
  w3.eagle.position.set(p.x + dir.x * 60 + Math.cos(a) * 35, p.y + 15, p.z + dir.z * 60 + Math.sin(a) * 35);
  w3.eagle.rotation.set(0.3, Math.atan2(-Math.cos(a), -Math.sin(a)), 0); // nose along the circle, banked
  updateOthers(dt);
  if (w3.horde) updateHorde(dt);

  // Voxel chunks around the rider: build nearest first (one per frame), drop far ones.
  const [ci, cj] = [Math.floor((p.x - T.ox) / T.cx / CHUNK), Math.floor((p.z - T.oz) / T.cz / CHUNK)];
  const wanted = [];
  for (let dj = -CHUNK_RADIUS; dj <= CHUNK_RADIUS; dj++) for (let di = -CHUNK_RADIUS; di <= CHUNK_RADIUS; di++) {
    const [i, j] = [ci + di, cj + dj];
    if (i >= 0 && j >= 0 && i * CHUNK < T.w && j * CHUNK < T.h && !w3.chunks.has(`${i},${j}`)) wanted.push([di * di + dj * dj, i, j]);
  }
  wanted.sort((a, b) => a[0] - b[0]);
  for (const [, i, j] of wanted.slice(0, w3.chunks.size ? 1 : 9)) {
    const m = chunkMesh(T, i, j);
    w3.group.add(m);
    w3.chunks.set(`${i},${j}`, m);
  }
  for (const [key, m] of w3.chunks) {
    const [i, j] = key.split(',').map(Number);
    if (Math.max(Math.abs(i - ci), Math.abs(j - cj)) > CHUNK_RADIUS + 1) {
      w3.group.remove(m);
      m.geometry.dispose();
      w3.chunks.delete(key);
    }
  }
}

// ---------- nature ambience (sources and licences: web/audio/CREDITS.md) ----------
const amb = { ctx:null, buffers:null, master:null, gains:null, windFilter:null, nodes:[], next:{}, muted:false };
const LOOPS = ['forest', 'meadow', 'stream', 'cowbells'], SHOTS = ['moo', 'marmot', 'woodpecker', 'buzzard', 'deer'];
try { amb.muted = localStorage.getItem('lemollet.muted') === '1' } catch {}
const attribution = () => `${ride.course.attribution} Sons : Wikimedia Commons et Freesound (domaine public, CC0).`;

async function startAmbience() {
  const ctx = amb.ctx;
  amb.buffers ??= Object.fromEntries(await Promise.all([...LOOPS, ...SHOTS].map(async n =>
    [n, await ctx.decodeAudioData(await (await fetch(`/audio/${n}.mp3`)).arrayBuffer())])));
  if ($('#ride').hidden) return; // left while loading
  stopAmbience();
  amb.master = ctx.createGain();
  amb.master.gain.value = amb.muted ? 0 : 0.8;
  amb.master.connect(ctx.destination);
  amb.gains = {};
  const loop = (buffer, node, offset = 0) => {
    const src = ctx.createBufferSource();
    src.buffer = buffer;
    src.loop = true;
    src.connect(node);
    src.start(0, offset);
    amb.nodes.push(src);
  };
  amb.next = {};
  for (const name of LOOPS) {
    const buf = amb.buffers[name], g = ctx.createGain();
    g.gain.value = 0;
    g.connect(amb.master);
    loop(buf, g, Math.random() * buf.duration);
    amb.gains[name] = g;
  }
  // Wind: looping white noise through a band-pass whose center follows speed.
  const noise = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate), data = noise.getChannelData(0);
  for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
  amb.windFilter = ctx.createBiquadFilter();
  amb.windFilter.type = 'bandpass';
  amb.windFilter.Q.value = 0.7;
  amb.gains.wind = ctx.createGain();
  amb.gains.wind.gain.value = 0;
  amb.windFilter.connect(amb.gains.wind).connect(amb.master);
  loop(noise, amb.windFilter);
  mixAmbience();
}

function stopAmbience() {
  for (const n of amb.nodes) n.stop();
  amb.nodes = [];
  amb.master?.disconnect();
  amb.gains = null;
}

// Fade each layer toward what surrounds the rider; animals call when close.
function mixAmbience() {
  if (!amb.gains) return;
  const s = ride.state, t = amb.ctx.currentTime, speed = s?.speed_kmh ?? 0;
  const high = Math.max(0, Math.min(1, ((s?.ele ?? 0) - 1500) / 800)); // fewer birds, more wind up high
  const near = { cow:Infinity, marmot:Infinity, deer:Infinity, chamois:Infinity };
  let [forest, grass, water] = [0, 0.6, 0]; // no terrain file: open meadow, no animals
  if (w3.T && w3.bike) {
    const T = w3.T, p = w3.bike.position;
    const [c0, r0] = [Math.floor((p.x - T.ox) / T.cx), Math.floor((p.z - T.oz) / T.cz)];
    let [n, f, g, wd] = [0, 0, 0, Infinity];
    for (let dr = -30; dr <= 30; dr += 3) for (let dc = -30; dc <= 30; dc += 3) { // ±150 m, every 15 m
      const [c, r] = [c0 + dc, r0 + dr];
      if (c < 0 || r < 0 || c >= T.w || r >= T.h) continue;
      const cov = T.cover[r * T.w + c], d = Math.hypot(dc * T.cx, dr * T.cz);
      if (cov === COVER.WATER) wd = Math.min(wd, d);
      if (d <= 60) { n++; f += cov === COVER.FOREST; g += cov === COVER.GRASS }
    }
    [forest, grass, water] = [f / (n || 1), g / (n || 1), wd < 150 ? 1 - wd / 150 : 0];
    for (let dr = -40; dr <= 40; dr++) for (let dc = -40; dc <= 40; dc++) { // every cell within ±200 m
      const kind = animalAt(T, c0 + dc, r0 + dr);
      if (kind) near[kind] = Math.min(near[kind], Math.hypot(dc * T.cx, dr * T.cz));
    }
  }
  const day = w3.sky?.visible ? 0 : 1; // night ride: birds and herds go quiet, streams and wind stay
  const set = (k, v) => amb.gains[k].gain.setTargetAtTime(v, t, 1.5);
  set('forest', forest * (1 - high) * 0.9 * day);
  set('meadow', grass * (1 - high) * 0.6 * day);
  set('stream', water * 0.8);
  set('cowbells', day && near.cow < 200 ? (1 - near.cow / 200) ** 1.5 * 0.9 : 0);
  set('wind', 0.06 + high * 0.25 + Math.min(1, speed / 60) ** 2 * 0.5);
  amb.windFilter.frequency.setTargetAtTime(300 + speed * 12, t, 1);

  const maybe = (name, when, gain, min, max) => {
    if (!when) return;
    amb.next[name] ??= t + Math.random() * min;
    if (t < amb.next[name]) return;
    const src = amb.ctx.createBufferSource(), g = amb.ctx.createGain();
    src.buffer = amb.buffers[name];
    g.gain.value = gain;
    src.connect(g).connect(amb.master);
    src.start();
    amb.next[name] = t + min + Math.random() * (max - min);
  };
  maybe('moo', day && near.cow < 120, 0.7 * (1 - near.cow / 120), 12, 35);
  maybe('marmot', day && near.marmot < 180, 0.8 * (1 - near.marmot / 180), 10, 30);
  maybe('deer', near.deer < 150, 0.6 * (1 - near.deer / 150), 20, 50);
  maybe('woodpecker', day && forest > 0.4 && high < 0.5, 0.5, 15, 45);
  maybe('buzzard', w3.eagle?.visible, 0.35, 25, 60);
}

function renderTheme() {
  if (!w3.group) menuSky();
  const light = document.documentElement.dataset.theme === 'light';
  $('#theme').textContent = light ? '☾ sombre' : '☀ clair';
  $('#theme').setAttribute('aria-pressed', light);
}
$('#theme').addEventListener('click', () => {
  const t = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light';
  document.documentElement.dataset.theme = t;
  try { localStorage.setItem('lemollet.theme', t) } catch {}
  renderTheme();
});
renderTheme();


function renderMute() {
  $('#mute').textContent = amb.muted ? '♪ off' : '♪ on';
  $('#mute').setAttribute('aria-pressed', amb.muted);
}
$('#mute').addEventListener('click', () => {
  amb.muted = !amb.muted;
  try { localStorage.setItem('lemollet.muted', amb.muted ? '1' : '0') } catch {}
  amb.master?.gain.setTargetAtTime(amb.muted ? 0 : 0.8, amb.ctx.currentTime, 0.1);
  renderMute();
});
renderMute();

// ---------- pause menu, ride summary and history ----------
const hms = s => { s = Math.floor(s); return `${Math.floor(s / 3600)}:${String(Math.floor(s / 60) % 60).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}` };

// Totals come from the Rust ride (energy, max power, climbing); averages derive from them.
function summary(s = ride.state ?? {}) {
  const t = s.elapsed ?? 0, z = s.zombie;
  return {
    date: new Date().toISOString(),
    kind: ride.mode,
    name: ride.mode === 'workout' ? ride.workout.name
      : ride.mode === 'zombie' ? `Zombie Halloween · vague ${z?.wave ?? 1} · ${z?.sprints_won ?? 0} sprint${z?.sprints_won > 1 ? 's' : ''}`
      : ride.course.name,
    ...(ride.mode === 'zombie' && { wave: z?.wave ?? 1, sprintsWon: z?.sprints_won ?? 0, sprints: z?.sprints ?? 0 }),
    elapsed: t,
    distance: s.ridden ?? 0, // ridden, not position: demo jumps don't count
    climbed: s.climbed ?? 0,
    avgPower: t ? (s.energy_kj ?? 0) * 1000 / t : 0,
    maxPower: s.max_power ?? 0,
    avgSpeed: t ? (s.ridden ?? 0) / t * 3.6 : 0,
    energyKj: s.energy_kj ?? 0,
    completed: ride.mode === 'workout' ? !!s.workout?.done : !!s.finished,
  };
}

function renderSummary(r) {
  const stat = (label, value, unit) => h('div', { class:'stat' }, h('small', {}, label), h('b', {}, value), h('i', {}, unit));
  if (r.kind === 'zombie') { // the score: how long, how far, how many sprints
    $('#menuStats').replaceChildren(
      stat('Survie', hms(r.elapsed), ''),
      stat('Distance', (r.distance / 1000).toFixed(2), 'km'),
      stat('Vague', r.wave, ''),
      stat('Sprints gagnés', r.sprintsWon, `/ ${r.sprints}`),
      stat('Puissance moy.', Math.round(r.avgPower), 'W'),
      stat('Puissance max', Math.round(r.maxPower), 'W'),
    );
    return;
  }
  $('#menuStats').replaceChildren(
    stat('Durée', hms(r.elapsed), ''),
    stat('Distance', (r.distance / 1000).toFixed(2), 'km'),
    r.kind === 'course' ? stat('Dénivelé', Math.round(r.climbed), 'm') : stat('Vitesse moy.', r.avgSpeed.toFixed(1), 'km/h'),
    stat('Puissance moy.', Math.round(r.avgPower), 'W'),
    stat('Puissance max', Math.round(r.maxPower), 'W'),
    stat('Énergie', Math.round(r.energyKj), 'kJ'), // ~ kcal burnt, human efficiency cancels out the unit change
  );
}

// mode: 'pause' (rider asked), 'end' (finish line / workout done), 'saved'.
function openMenu(mode) {
  const r = summary();
  const end = { workout:'Séance terminée, bravo !', zombie:'Les zombies t\'ont rattrapé !', course:'Arrivée !' }[ride.mode];
  const titles = { pause:'Pause', end, saved:'Sortie enregistrée' };
  $('#menuTitle').textContent = titles[mode];
  renderSummary(r);
  $('#resume').hidden = mode !== 'pause';
  $('#saveQuit').hidden = $('#quitNoSave').hidden = mode === 'saved';
  $('#saveQuit').disabled = r.elapsed < 1;
  $('#toHome').hidden = mode !== 'saved';
  $('#menu').hidden = false;
  if (mode === 'pause') fetch(`/pause?session=${ride.session}&on=1`).catch(() => {});
  ($('#resume').hidden ? ($('#toHome').hidden ? $('#saveQuit') : $('#toHome')) : $('#resume')).focus();
}

function resumeRide() {
  $('#menu').hidden = true;
  fetch(`/pause?session=${ride.session}&on=0`).catch(() => {});
}

function checkEnd() {
  const s = ride.state;
  const done = { workout:s?.workout?.done, zombie:s?.zombie?.over, course:s?.finished }[ride.mode];
  if (ride.ended || !done) return;
  ride.ended = true;
  openMenu('end');
}

// ponytail: history lives in the browser profile (cap 200), move to the Rust backend with login
function saveRide() {
  const r = summary();
  current.history = [r, ...(current.history ?? [])].slice(0, 200);
  persist();
  ride.events?.close();
  stopAmbience();
  openMenu('saved');
}

function renderHistory() {
  const list = current.history ?? [];
  if (!list.length) { $('#history').replaceChildren(); return }
  const km = list.reduce((a, r) => a + r.distance, 0) / 1000, up = list.reduce((a, r) => a + r.climbed, 0);
  $('#history').replaceChildren(
    h('h2', {}, `Tes sorties · ${list.length} · ${km.toFixed(0)} km · +${Math.round(up)} m`),
    ...list.slice(0, 5).map(r => h('div', { class:'history-row' },
      h('strong', {}, `${new Date(r.date).toLocaleDateString('fr-FR', { day:'2-digit', month:'2-digit' })} · ${r.name}${r.completed ? ' ✓' : ''}`),
      h('span', {}, `${hms(r.elapsed)} · ${(r.distance / 1000).toFixed(1)} km · ${Math.round(r.avgPower)} W moy.`))),
  );
}

$('#resume').addEventListener('click', resumeRide);
$('#saveQuit').addEventListener('click', saveRide);
$('#quitNoSave').addEventListener('click', () => { if (confirm('Quitter sans enregistrer cette sortie ?')) showHome() });
$('#toHome').addEventListener('click', () => showHome());
addEventListener('keydown', e => {
  if (e.key !== 'Escape' || $('#ride').hidden) return;
  if ($('#menu').hidden) openMenu('pause');
  else if (!$('#resume').hidden) resumeRide();
});

$('#goRide').addEventListener('click', showRideMenu);
$('#goCircuits').addEventListener('click', showCourses);
$('#goFree').addEventListener('click', showFree);
$('#rideMenuBack').addEventListener('click', () => showHome());
$('#freeBack').addEventListener('click', showRideMenu);
$('#goTrain').addEventListener('click', showTraining);
$('#goZombie').addEventListener('click', openZombie);
$('#goGarage').addEventListener('click', openGarage);
$('#switchProfile').addEventListener('click', showProfiles);
$('#leave').addEventListener('click', () => openMenu('pause'));
$('#coursesBack').addEventListener('click', showRideMenu);
$('#trainingBack').addEventListener('click', () => showHome());
$('#back').addEventListener('click', () => showHome());
$('#autoBtn').addEventListener('click', () => {
  ride.auto = !ride.auto;
  $('#autoBtn').classList.toggle('on', ride.auto);
  $('#autoBtn').setAttribute('aria-pressed', ride.auto);
});
Promise.all(['/courses', '/workouts'].map(u => fetch(u).then(r => r.ok ? r.json() : null).catch(() => null))).then(([list, workouts]) => {
  [ride.list, ride.workouts] = [list, workouts ?? []];
  if (current && !$('#home').hidden) showHome();
});
showProfiles();
</script>
