<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Le Mollet</title>
<!-- Favicon from docs/logo.png: the mountain "O" of MOLLET and the orange stroke. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b1220'/%3E%3Ccircle cx='32' cy='28' r='22' fill='%23f7f1e3'/%3E%3Cpath d='M12 39l12-15 6 7 8-12 14 20z' fill='%230b1220'/%3E%3Cpath d='M6 56l52-8-3 6-50 7z' fill='%23f97a1a'/%3E%3C/svg%3E">
<script>
// Before first paint, so there is no flash: saved choice, else the system setting.
try { document.documentElement.dataset.theme = localStorage.getItem('lemollet.theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark') } catch { document.documentElement.dataset.theme = 'dark' }
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root { --bg:#14171c; --panel:#1f242c; --panel-hi:#2b323d; --ink:#eef1f5; --muted:#9aa4b2; --accent:#f2cd37; --line:#0b0d10; }
:root[data-theme=light] { --bg:#e9edf1; --panel:#f7f8fa; --panel-hi:#ffffff; --ink:#1b2a34; --muted:#5a6573; --accent:#f2cd37; --line:#1b2a34 }
* { box-sizing:border-box }
[hidden] { display:none !important }
html, body { margin:0; height:100%; background:var(--bg); color:var(--ink); font:15px/1.4 Inter, system-ui, sans-serif; overflow:hidden }
#scene { position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none }
.ui { position:fixed; inset:0; pointer-events:none; display:flex; flex-direction:column }
header { padding:16px; font-family:Silkscreen, monospace; font-size:22px; letter-spacing:1px; color:#eef1f5; text-shadow:3px 3px 0 #0b0d10; display:flex; align-items:center; justify-content:space-between }
#theme { pointer-events:auto; font-size:12px; padding:6px 10px }
header b { color:var(--accent) }
.block { background:var(--panel); border:3px solid var(--line); box-shadow:inset -4px -4px 0 rgba(0,0,0,.35), inset 4px 4px 0 rgba(255,255,255,.08) }
.panel { padding:20px; pointer-events:auto }
h1, h2, legend { font-family:Silkscreen, monospace; font-weight:700; margin:0 0 12px }
h1 { font-size:24px } h2 { font-size:18px }
.muted { color:var(--muted); margin:0 0 16px }

#profiles { flex:1; display:flex; align-items:center; justify-content:center; padding:0 16px 16px; min-height:0 }
#profiles .panel { width:min(520px, 100%); max-height:100%; overflow:auto }
.list { display:grid; gap:10px; margin-bottom:16px }
.card { display:flex; align-items:center; gap:12px; padding:10px 12px; cursor:pointer; background:var(--panel-hi) }
.card:hover, .card:focus-visible { outline:3px solid var(--accent); outline-offset:-3px }
.avatar { width:44px; height:44px; flex:none; display:grid; place-items:center; font-family:Silkscreen, monospace; font-size:22px; color:#fff; text-shadow:2px 2px 0 rgba(0,0,0,.45); border:3px solid var(--line) }
.meta { flex:1; min-width:0; display:flex; flex-direction:column }
.meta strong { overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
.meta small { color:var(--muted) }
.del { background:none; border:0; color:var(--muted); font-size:22px; cursor:pointer; padding:4px 8px }
.del:hover, .del:focus-visible { color:#ff6b5b }
.new { display:grid; grid-template-columns:1fr 1fr; gap:10px }
.new .full { grid-column:1 / -1 }
label { display:flex; flex-direction:column; gap:4px; font-size:12px; color:var(--muted) }
input, select { font:inherit; color:var(--ink); background:var(--bg); border:3px solid var(--line); padding:8px 10px; width:100% }
input:focus, select:focus { outline:3px solid var(--accent); outline-offset:-3px }
.inline { flex-direction:row; align-items:center; gap:8px; margin-top:6px }
.inline select { width:auto; padding:4px 8px }

.btn, .seg button { font-family:Silkscreen, monospace; font-size:14px; color:var(--ink); background:var(--panel-hi); border:3px solid var(--line); box-shadow:inset -3px -3px 0 rgba(0,0,0,.35), inset 3px 3px 0 rgba(255,255,255,.12); padding:8px 12px; cursor:pointer }
.btn:active, .seg button:active { box-shadow:inset 3px 3px 0 rgba(0,0,0,.35) }
.btn:focus-visible, .seg button:focus-visible, .sw:focus-visible { outline:3px solid var(--ink); outline-offset:1px }
.primary, .seg button.on { background:var(--accent); color:#1b2a34 }

#garage { flex:1; display:flex; justify-content:flex-end; padding:0 16px 16px; min-height:0 }
.side { width:330px; overflow:auto; display:flex; flex-direction:column; gap:16px }
.side .btn { align-self:flex-start }
.garage-nav { align-self:flex-start; margin-right:auto; display:flex; flex-direction:column; gap:8px; padding:12px }
.garage-nav .btn.on { background:var(--accent); color:#1b2a34 }
#options { display:flex; flex-direction:column; gap:16px }
.opt { border:0; padding:0; margin:0 }
.opt legend { font-size:13px; margin-bottom:8px }
.seg { display:flex; gap:6px; flex-wrap:wrap }
.seg button { flex:1 }
.swatches { display:grid; grid-template-columns:repeat(6, 1fr); gap:6px }
.sw { aspect-ratio:1; border:3px solid var(--line); cursor:pointer; box-shadow:inset -3px -3px 0 rgba(0,0,0,.3), inset 3px 3px 0 rgba(255,255,255,.25) }
.sw.on { outline:3px solid var(--ink); outline-offset:1px }

#ride { flex:1; display:flex; flex-direction:column; justify-content:space-between; gap:12px; padding:0 16px 16px; min-height:0 }
.stats { display:grid; grid-template-columns:repeat(6, 1fr); gap:12px; padding:14px 20px }
.stat small { display:block; font-family:Silkscreen, monospace; font-size:11px; color:var(--muted) }
.stat b { font-family:Silkscreen, monospace; font-size:26px; font-weight:700 }
.stat i { font-style:normal; font-size:12px; color:var(--muted); margin-left:4px }
.finish { grid-column:1 / -1; font-family:Silkscreen, monospace; font-size:20px; color:var(--accent); text-align:center }
.profile { display:flex; flex-direction:column; gap:8px; padding:14px 20px }
.ride-head { display:flex; justify-content:space-between; align-items:center; gap:12px }
.ride-head h2 { margin:0 }
#profileCanvas { width:100%; height:160px; display:block }
#profileCanvas.seekable { cursor:pointer }
#ride.world3d #profileCanvas { height:90px }
.attrib { color:var(--muted); font-size:11px }
#rideBtn { align-self:stretch }
#mirror { align-self:flex-end; margin-bottom:auto; width:min(260px, 45vw); aspect-ratio:1.8; border:3px solid var(--line); outline:2px solid #fe8a18; position:relative }
#mirror small { position:absolute; left:4px; top:2px; font-family:Silkscreen, monospace; font-size:10px; color:#fe8a18 }
#courses { flex:1; display:flex; align-items:center; justify-content:center; padding:0 16px 16px; min-height:0 }
#courses .panel { width:min(560px, 100%); max-height:100%; overflow:auto }
.course-card { display:flex; flex-direction:column; gap:6px; padding:12px; cursor:pointer; background:var(--panel-hi) }
.course-card:hover, .course-card:focus-visible { outline:3px solid var(--accent); outline-offset:-3px }
.course-card canvas { width:100%; height:48px; display:block }
.course-card small { color:var(--muted) }
.demo { display:flex; align-items:center; gap:10px }
.demo label { flex-direction:row; align-items:center; gap:8px; font-family:Silkscreen, monospace; font-size:13px; color:var(--ink) }
.demo output { font-family:Silkscreen, monospace; font-size:20px; min-width:84px; text-align:right }
.demo .btn { padding:6px 10px }
input[type=range] { flex:1; accent-color:var(--accent); padding:0; border:0; background:none; height:28px }

/* Home */
#home, #training { flex:1; display:flex; align-items:center; justify-content:center; padding:0 16px 16px; min-height:0 }
#home .panel { width:min(860px, 100%); max-height:100%; overflow:auto }
#profileEdit { flex:1; display:flex; align-items:center; justify-content:center; padding:0 16px 16px; min-height:0 }
#profileEdit .panel { width:min(520px, 100%); max-height:100%; overflow:auto }
.ident { margin:16px 0 0; padding:10px 12px; background:var(--bg); border:3px solid var(--line); font-size:12px; color:var(--muted); overflow-wrap:anywhere }
.ident code { color:var(--ink) }
.form-actions { grid-column:1 / -1; display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap; margin-top:4px }
.hello { display:flex; align-items:center; gap:14px; margin-bottom:18px }
.hello .avatar { width:56px; height:56px; font-size:28px }
.hello h1 { margin:0 }
.tiles { display:grid; grid-template-columns:repeat(4, 1fr); gap:14px }
.tile { display:flex; flex-direction:column; align-items:flex-start; gap:10px; padding:18px; min-height:170px; text-align:left; cursor:pointer; color:#eef1f5; font:inherit; border:3px solid var(--line); box-shadow:inset -5px -5px 0 rgba(0,0,0,.3), inset 5px 5px 0 rgba(255,255,255,.15) }
.tile:hover, .tile:focus-visible { outline:3px solid var(--ink); outline-offset:2px; transform:translateY(-2px) }
.tile b { font-family:Silkscreen, monospace; font-size:22px }
.tile small { opacity:.85 }
.tile svg { width:48px; height:48px; image-rendering:pixelated }
.tile.ride { background:#c91a09 } .tile.train { background:#0055bf } .tile.garage { background:#237841 } .tile.me { background:#81007b }
/* Game mode: a full-width Halloween banner under the four tiles */
.tile.zombie { grid-column:1 / -1; min-height:0; flex-direction:row; align-items:center; background:linear-gradient(90deg, #3a1a4a, #fe8a18) }
.zombie-hud { color:#bbe90b }
.zombie-hud.sprint { color:var(--accent); animation:blink .6s steps(2) infinite }
@keyframes blink { 50% { opacity:.55 } }
@media (prefers-reduced-motion:reduce) { .zombie-hud.sprint { animation:none } }
.home-foot { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-top:16px; flex-wrap:wrap }

/* Fridge door with course magnets */
#courses .panel { width:min(860px, 100%); max-height:100%; overflow:auto }
.fridge { padding:28px 20px; display:flex; flex-wrap:wrap; gap:34px 28px; justify-content:center; border:3px solid var(--line);
  background:linear-gradient(180deg, #e9edf1, #c9d0d6), repeating-linear-gradient(90deg, rgba(255,255,255,.18) 0 2px, transparent 2px 5px); background-blend-mode:overlay }
.magnet { position:relative; width:230px; height:180px; padding:0; border:4px solid #fff; border-radius:16px; overflow:hidden; cursor:pointer;
  transform:rotate(var(--r)); box-shadow:0 5px 0 rgba(0,0,0,.18), 0 12px 20px rgba(0,0,0,.35); transition:transform .15s, box-shadow .15s; background:#fff }
.magnet:hover, .magnet:focus-visible { transform:rotate(0) translateY(-6px) scale(1.04); box-shadow:0 8px 0 rgba(0,0,0,.15), 0 22px 30px rgba(0,0,0,.4); outline:none }
.magnet canvas { position:absolute; inset:0; width:100%; height:100% }
.magnet .ribbon { position:absolute; left:0; right:0; bottom:0; padding:8px 10px 9px; font-family:Silkscreen, monospace; font-size:15px; font-weight:700; color:#fff; text-shadow:2px 2px 0 rgba(0,0,0,.4); text-align:left }
.magnet .ribbon small { display:block; font-family:Inter, sans-serif; font-weight:600; font-size:11px; text-shadow:none; opacity:.9 }
.magnet .badge { position:absolute; top:8px; right:8px; width:58px; height:58px; border-radius:50%; display:grid; place-items:center; text-align:center;
  background:#f2cd37; color:#1b2a34; border:3px solid #fff; font-family:Silkscreen, monospace; font-size:12px; line-height:1.05; transform:rotate(12deg); box-shadow:0 3px 0 rgba(0,0,0,.2) }

/* Open worlds */
#rideMenu, #free { flex:1; display:flex; align-items:center; justify-content:center; padding:0 16px 16px; min-height:0 }
#rideMenu .panel { width:min(620px, 100%); max-height:100%; overflow:auto }
#free .panel { width:min(720px, 100%); max-height:100%; overflow:auto }
.tiles.two { grid-template-columns:repeat(2, 1fr); margin-bottom:14px }
.tile.free { background:#36aebf }
.online { color:#5d9b3a; font-weight:600 }

/* Training */
#training .panel { width:min(720px, 100%); max-height:100%; overflow:auto }
.workout-card { display:flex; flex-direction:column; gap:6px; padding:12px; cursor:pointer; background:var(--panel-hi) }
.workout-card:hover, .workout-card:focus-visible { outline:3px solid var(--accent); outline-offset:-3px }
.workout-card .row { display:flex; justify-content:space-between; gap:12px; align-items:baseline }
.workout-card small { color:var(--muted) }
.workout-card canvas { width:100%; height:44px; display:block }
#autoBtn.on { background:var(--accent); color:#1b2a34 }

/* Pause / end-of-ride menu */
.modal { position:fixed; inset:0; z-index:10; display:grid; place-items:center; padding:16px; background:rgba(11,13,16,.6); pointer-events:auto }
.modal .panel { width:min(520px, 100%); max-height:100%; overflow:auto }
.summary { display:grid; grid-template-columns:repeat(3, 1fr); gap:12px; margin:8px 0 18px }
.summary .stat b { font-size:22px }
.menu-actions { display:flex; flex-direction:column; gap:10px }
.menu-actions .btn { text-align:center }
.danger { color:#ff8a7a }
/* Ride history on the home screen */
.history { margin-top:18px }
.history h2 { font-size:14px; margin-bottom:8px }
.history-row { display:flex; justify-content:space-between; gap:10px; padding:8px 10px; background:var(--panel-hi); border:3px solid var(--line); margin-top:6px; font-size:13px }
.history-row span { color:var(--muted) }

@media (max-width:900px) and (min-width:701px) { .tiles { grid-template-columns:repeat(2, 1fr) } }
@media (max-width:700px) { .tiles.two { grid-template-columns:1fr } }
@media (max-width:700px) {
  .tiles { grid-template-columns:1fr }
  .summary { grid-template-columns:repeat(2, 1fr) }
  .history-row { flex-direction:column; gap:2px }
  .tile { min-height:0; flex-direction:row; align-items:center }
  .magnet { width:100%; max-width:300px }
  .stats { grid-template-columns:repeat(3, 1fr); padding:12px 16px }
  .stat b { font-size:20px }
  #ride { padding:0 0 0 }
  #profileCanvas { height:120px }
  header { font-size:18px; padding:12px 16px }
  #garage { flex-direction:column; justify-content:flex-end; padding:0 }
  .garage-nav { flex-direction:row; align-self:stretch; margin:0; padding:8px 16px }
  .garage-nav .btn { flex:1 }
  .side { width:100%; max-height:48vh; padding:16px }
}
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="scene"></canvas>
<div class="ui">
  <header><span>LE <b>MOLLET</b></span><button class="btn" id="theme" aria-label="Basculer thème clair ou sombre"></button></header>

  <main id="profiles">
    <div class="block panel">
      <h1>Qui roule ?</h1>
      <div id="list" class="list"></div>
      <p id="empty" class="muted">Aucun profil. Crée le tien pour monter en selle.</p>
      <form id="new" class="new">
        <label class="full">Nom<input name="name" maxlength="24" required autocomplete="off"></label>
        <label>Poids (kg)<input name="weight" type="number" min="30" max="200" step="0.1" value="75" required></label>
        <label>FTP (W)<input name="ftp" type="number" min="50" max="600" value="200" required></label>
        <label class="full">Nationalité (optionnel)<select name="country" class="countries"></select></label>
        <button class="btn primary full">Créer le profil</button>
      </form>
    </div>
  </main>

  <main id="home" hidden>
    <div class="block panel">
      <div class="hello"><span class="avatar" id="homeAvatar"></span><div><h1 id="homeHello"></h1><small class="muted" id="homeStats"></small></div></div>
      <div class="tiles">
        <button class="tile ride" id="goRide">
          <svg viewBox="0 0 12 12" aria-hidden="true"><path fill="#fff" d="M0 11h12v1H0zM1 10h10v1H1zM2 9h3V8h1V6h1v1h1v1h1v1h1v1H2zM5 5h2v1H5zM6 4h1v1H6z"/></svg>
          <b>Rouler</b><small id="goRideSub">Cols mythiques et monde ouvert</small>
        </button>
        <button class="tile train" id="goTrain">
          <svg viewBox="0 0 12 12" aria-hidden="true"><path fill="#fff" d="M0 11h12v1H0zM1 8h2v3H1zM4 5h2v6H4zM7 7h2v4H7zM10 2h2v9h-2z"/></svg>
          <b>Training</b><small id="goTrainSub">Séances structurées sur ta FTP</small>
        </button>
        <button class="tile garage" id="goGarage">
          <svg viewBox="0 0 12 12" aria-hidden="true"><path fill="#fff" d="M1 7h3v3H1zM8 7h3v3H8zM4 6h4v1H4zM5 4h2v2H5zM8 3h2v1H8zM2 5h1v2H2z"/></svg>
          <b>Garage</b><small>Personnalise ton vélo</small>
        </button>
        <button class="tile me" id="goProfile">
          <svg viewBox="0 0 12 12" aria-hidden="true"><path fill="#fff" d="M4 1h4v1h1v3H8v1H4V5H3V2h1zM2 7h8v1h1v3H1V8h1z"/></svg>
          <b>Profil</b><small>Poids, FTP, nationalité</small>
        </button>
        <button class="tile zombie" id="goZombie">
          <svg viewBox="0 0 12 12" aria-hidden="true"><path fill="#bbe90b" d="M3 1h6v1h1v4H9v1H3V6H2V2h1zM4 3v2h1V3zM7 3v2h1V3zM4 8h4v1h4v1H8v2H7v-2H5v2H4v-2H0V9h4z"/></svg>
          <span><b>Zombie Halloween</b><br><small id="goZombieSub">Pédale de plus en plus vite : la horde arrive. Mini sprints et bonus sur la route.</small></span>
        </button>
      </div>
      <div class="history" id="history"></div>
      <div class="home-foot">
        <small class="muted" id="homeMode"></small>
        <button class="btn" id="switchProfile">‹ Changer de profil</button>
      </div>
    </div>
  </main>

  <main id="profileEdit" hidden>
    <div class="block panel">
      <div class="ride-head">
        <h1>Profil</h1>
        <button class="btn" id="profileBack">‹ Accueil</button>
      </div>
      <form id="editProfile" class="new">
        <label class="full">Nom<input name="name" maxlength="24" required autocomplete="off"></label>
        <label>Poids (kg)<input name="weight" type="number" min="30" max="200" step="0.1" required></label>
        <label>FTP (W)<input name="ftp" type="number" min="50" max="600" required></label>
        <label class="full">Nationalité (optionnel)<select name="country" class="countries"></select></label>
        <div class="form-actions">
          <button class="btn primary">Enregistrer</button>
          <button class="btn danger" type="button" id="deleteProfile">Supprimer le profil</button>
        </div>
      </form>
      <p class="ident" id="profileIdent"></p>
    </div>
  </main>

  <main id="garage" hidden>
    <nav class="block panel garage-nav" aria-label="Garage">
      <button class="btn" data-tab="bike">Vélo</button>
      <button class="btn" data-tab="rider">Cycliste</button>
    </nav>
    <aside class="block panel side">
      <button class="btn" id="back">‹ Accueil</button>
      <h2>Garage de <span id="who"></span></h2>
      <div id="options"></div>
      <p class="muted">Glisse pour tourner autour du vélo, molette ou pincement pour zoomer.</p>
    </aside>
  </main>
  <main id="rideMenu" hidden>
    <div class="block panel">
      <div class="ride-head">
        <h1>Où veux-tu rouler ?</h1>
        <button class="btn" id="rideMenuBack">‹ Accueil</button>
      </div>
      <div class="tiles two">
        <button class="tile ride" id="goCircuits">
          <svg viewBox="0 0 12 12" aria-hidden="true"><path fill="#fff" d="M0 11h12v1H0zM1 10h10v1H1zM2 9h3V8h1V6h1v1h1v1h1v1h1v1H2zM5 5h2v1H5zM6 4h1v1H6z"/></svg>
          <b>Circuits</b><small id="goCircuitsSub">Les cols mythiques, en vrai relief</small>
        </button>
        <button class="tile free" id="goFree">
          <svg viewBox="0 0 12 12" aria-hidden="true"><path fill="#fff" d="M3 1h6v1h1v1h1v6h-1v1H9v1H3v-1H2V9H1V3h1V2h1zM3 3v6h6V3zM8 0h2v1H8zM10 1h1v2h-1z"/></svg>
          <b>Free</b><small id="goFreeSub">Boucles ouvertes à tous</small>
        </button>
      </div>
      <p class="muted" id="modeHint"></p>
    </div>
  </main>

  <main id="courses" hidden>
    <div class="block panel">
      <div class="ride-head">
        <h1>Circuits</h1>
        <button class="btn" id="coursesBack">‹ Rouler</button>
      </div>
      <div id="courseList" class="fridge"></div>
    </div>
  </main>

  <main id="free" hidden>
    <div class="block panel">
      <div class="ride-head">
        <h1>Free</h1>
        <button class="btn" id="freeBack">‹ Rouler</button>
      </div>
      <p class="muted">Des boucles ouvertes à tous : chaque cycliste connecté voit les autres rouler.</p>
      <div id="worldList" class="list"></div>
    </div>
  </main>

  <main id="training" hidden>
    <div class="block panel">
      <div class="ride-head">
        <h1>Training</h1>
        <button class="btn" id="trainingBack">‹ Accueil</button>
      </div>
      <p class="muted" id="trainingHint"></p>
      <div id="workoutList" class="list"></div>
    </div>
  </main>

  <main id="ride" hidden>
    <div class="block panel stats" id="stats"></div>
    <div id="mirror" hidden aria-hidden="true"><small>Rétro</small></div>
    <div class="block panel profile">
      <div class="ride-head">
        <h2 id="courseName"></h2>
        <span>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ---------- data ----------
const PALETTE = {
  Rouge:'#c91a09', Orange:'#fe8a18', Jaune:'#f2cd37', Citron:'#bbe90b', Vert:'#237841', Azur:'#36aebf',
  Bleu:'#0055bf', Violet:'#81007b', Rose:'#fc97ac', Blanc:'#f4f4f4', Gris:'#6c6e68', Noir:'#1b2a34',
};
const DEFAULT_BIKE = { style:'lego', frameType:'road', frame:'#c91a09', accent:'#f4f4f4', rim:'#1b2a34', saddle:'#1b2a34', rimDepth:2, bars:'drop' };
// The rider's outfit and look live in the same profile object as the bike (no jersey: it follows the frame).
const DEFAULT_RIDER = { shorts:'#1b2a34', shoes:'#f4f4f4', helmet:'on', helmetColor:'#f4f4f4', hair:'short', hairColor:'#3b2416', skin:'#e0ac69' };
// Frame shapes, in garage voxels (side view): seat cluster, head tube top/bottom, and extras.
const FRAMES = {
  road:    { seat:[7, 12], ht:[23, 13], hb:[24, 10] },
  aero:    { seat:[8, 11], ht:[23, 13], hb:[24, 10], thick:true, lowStays:true },
  gravel:  { seat:[7, 12], ht:[23, 15], hb:[24, 10], fatTires:true },

};
// Garage options; tab:'rider' ones show under "Cycliste" in the left menu, the rest under "Vélo".
const OPTIONS = [
  { key:'style', label:'Style', choices:[['lego','Brique'], ['voxel','Cube'], ['lowpoly','Low-poly']] },
  { key:'frameType', label:'Cadre', choices:[['road', 'Route'], ['aero', 'Aéro'], ['gravel', 'Gravel'], ['vintage', 'Vintage']] },
  { key:'frame', label:'Couleur du cadre', colors:true },
  { key:'accent', label:'Fourche', colors:true },
  { key:'rim', label:'Couleur des jantes', colors:true },
  { key:'rimDepth', label:'Profil des jantes', choices:[[1,'Basses'], [2,'Aéro'], [3,'Profondes']] },

  { key:'hairColor', tab:'rider', label:'Cheveux', colors:{ Blond:'#e8c872', Châtain:'#8b5a2b', Brun:'#3b2416', Noir:'#1b1b1b', Roux:'#b5481d', Gris:'#b9b9b9' } },
  { key:'skin', tab:'rider', label:'Peau', colors:{ Porcelaine:'#f6d7b3', Clair:'#e8b98f', Doré:'#e0ac69', Mat:'#c68642', Brun:'#8d5524', Ébène:'#5c3a21', Brique:'#f2cd37' } },
];

// ponytail: profiles live in this browser only, move to the Rust backend when login lands
const KEY = 'lemollet.profiles.v1';

const persist = () => { try { localStorage.setItem(KEY, JSON.stringify(profiles)) } catch {} };

// Profile id: UUID v4, the stable key for a future backend; the name is only a label.
// crypto.randomUUID needs a secure context (not plain http on the LAN), getRandomValues does not.
const UUID_RE = /^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/;
function newId() {
  if (crypto.randomUUID) return crypto.randomUUID();
  const b = crypto.getRandomValues(new Uint8Array(16));
  b[6] = (b[6] & 0x0f) | 0x40; // version 4

}
// Migrate older profiles (time-based ids, no creation date) once.
{
  const seen = new Set();
  let changed = false;
  for (const p of profiles) {
    if (!UUID_RE.test(p.id ?? '') || seen.has(p.id)) { p.id = newId(); changed = true }
    if (!p.createdAt) { p.createdAt = new Date().toISOString(); changed = true }
    seen.add(p.id);
  }
  if (changed) persist();
}
let current = null;

// ---------- voxel bike (side view in x/y, z = width; 1 unit ≈ 37 mm) ----------
const TIRE = '#1b2a34', METAL = '#a0a5a9', CHAIN = '#6c6e68';
function bikeVoxels(b) {
  const v = new Map();
  const put = (x, y, z, c) => v.set(`${x},${y},${z}`, c);
  const line = (ax, ay, bx, by, z, c) => {
    const n = Math.ceil(Math.hypot(bx - ax, by - ay) * 2);
    for (let i = 0; i <= n; i++) put(Math.round(ax + (bx - ax) * i / n), Math.round(ay + (by - ay) * i / n), z, c);
  };
  const ring = (cx, cy, r0, r1, z, c) => {
    for (let x = Math.floor(cx - r1 - 1); x <= cx + r1 + 1; x++)
      for (let y = Math.floor(cy - r1 - 1); y <= cy + r1 + 1; y++) {
        const d = Math.hypot(x - cx, y - cy);
        if (d > r0 - 0.5 && d <= r1 + 0.5) put(x, y, z, c);
      }
  };

  // Geometry keeps tubes clear of the tires (checked by distance to hub > R + 0.5).
  const F = FRAMES[b.frameType] ?? FRAMES.road;
  const R = 9, REAR = 0, FRONT = 28, BB = [11, -2], SEAT = F.seat, HB = F.hb, HT = F.ht;
  const tireIn = F.fatTires ? R - 1 : R; // fat tires eat into the rim
  for (const hx of [REAR, FRONT]) {
    const inner = tireIn - 1 - b.rimDepth;
    for (let k = 0; k < 8; k++) {
      const a = k * Math.PI / 4 + Math.PI / 8;
      line(hx, 0, hx + Math.cos(a) * inner, Math.sin(a) * inner, 0, METAL);
    }
    ring(hx, 0, tireIn - b.rimDepth, tireIn - 1, 0, b.rim);
    ring(hx, 0, tireIn, R, 0, TIRE);
    for (let z = -1; z <= 1; z++) put(hx, 0, z, METAL);
    if (F.fenders) for (let a = 0.35; a <= 2.8; a += 0.08) put(Math.round(hx + Math.cos(a) * (R + 1.5)), Math.round(Math.sin(a) * (R + 1.5)), 0, METAL);
  }

  line(...SEAT, ...HT, 0, b.frame);   // top tube
  line(...BB, ...HB, 0, b.frame);     // down tube
  line(...BB, ...SEAT, 0, b.frame);   // seat tube
  if (F.thick) { // aero: deep tube sections
    line(SEAT[0], SEAT[1] - 1, HT[0], HT[1] - 1, 0, b.frame);
    line(BB[0], BB[1] + 1, HB[0], HB[1] - 1, 0, b.frame);
    line(BB[0] - 1, BB[1], SEAT[0] - 1, SEAT[1], 0, b.frame);
  }
  line(...HB, ...HT, 0, b.accent);    // head tube
  const stays = F.lowStays ? [Math.round(BB[0] + (SEAT[0] - BB[0]) * 0.6), Math.round(BB[1] + (SEAT[1] - BB[1]) * 0.6)] : SEAT;
  for (const z of [-1, 1]) {
    line(...stays, REAR, 0, z, b.frame); // seat stays
    line(...BB, REAR, 0, z, b.frame);   // chainstays
    line(...HB, FRONT, 0, z, b.accent); // fork
  }
  if (F.lugs) for (const [x, y] of [SEAT, HT, HB, BB]) for (let z = -1; z <= 1; z++) put(x, y, z, b.accent); // vintage lugs

  line(...SEAT, 6, 15, 0, METAL); // seatpost
  for (let x = 3; x <= 9; x++) for (let z = -1; z <= 1; z++) if (x < 8 || z === 0) put(x, 16, z, b.saddle);

  const [BX, BY] = [HT[0] + 2, HT[1] + 1]; // bars sit just above the head tube
  line(...HT, BX, BY, 0, METAL); // stem
  if (b.bars === 'flat') {
    for (let z = -5; z <= 5; z++) put(BX, BY, z, Math.abs(z) >= 4 ? TIRE : METAL);
  } else {
    for (let z = -3; z <= 3; z++) put(BX, BY, z, METAL);
    for (const z of [-3, 3]) {
      const path = b.bars === 'drop' ? [[1, 0], [1, 1], [2, -1], [2, -2], [1, -3], [0, -3]] : [[1, 0], [2, 0], [3, 1]];
      for (const [dx, dy] of path) put(BX + dx, BY + dy, z, TIRE);
    }
    if (b.bars === 'aero') for (const z of [-1, 1]) {
      put(BX, BY + 1, z, TIRE);
      for (let x = BX + 1; x <= BX + 5; x++) put(x, BY + 1, z, METAL);
    }
  }

  const [bx, by] = BB;
  ring(bx, by, 3, 4, 2, METAL); // chainring
  ring(REAR, 0, 1, 2, 2, METAL); // cassette
  line(bx, by + 4, REAR, 2, 2, CHAIN);
  line(bx, by - 4, REAR, -2, 2, CHAIN);

  if (b.rider) { // seated rider on the hoods; older profiles fall back to a jersey in the frame color
    const a = { ...DEFAULT_RIDER, jersey:b.frame, ...b };
    const SKIN = a.skin, HAIR = a.hairColor, helmet = a.helmet === 'on';
    for (let z = -2; z <= 2; z++) line(6, 17, 18, 23, z, a.jersey); // torso
    const sleeve = [Math.round(18 + (BX - 18) * 0.35), Math.round(23 + (BY + 2 - 23) * 0.35)];
    for (const [z, px, py] of [[3, bx + 2, by - 4], [-3, bx - 2, by + 4]]) {
      const knee = z > 0 ? [14, 6] : [16, 13];
      line(6, 17, ...knee, z, a.shorts); // thigh
      line(...knee, px, py + 1, z, SKIN); // shin
      put(px, py + 1, z, a.shoes); put(px + 1, py + 1, z, a.shoes); // shoe on the pedal
      line(18, 23, BX, BY + 2, z, SKIN);  // arm to the hoods
      line(18, 23, ...sleeve, z, a.jersey); // short sleeve
    }
    // Head faces +x: x 19..22, y 24..27. Helmet covers the top two rows, hair shows below it or on top without.
    for (let x = 19; x <= 22; x++) for (let y = 24; y <= 27; y++) for (let z = -1; z <= 1; z++)
      put(x, y, z, helmet && y >= 26 ? a.helmetColor : SKIN);
    const hair = [];
    if (!helmet && a.hair !== 'bald') {
      for (let x = 19; x <= 22; x++) hair.push([x, 27]);
      hair.push([19, 26], [19, 25]);
    }
    if (a.hair === 'long') for (let y = 21; y <= (helmet ? 25 : 27); y++) hair.push([18, y]);
    if (a.hair === 'ponytail') for (const [x, y] of [[18, 25], [17, 24], [17, 23], [16, 22]]) put(x, y, 0, HAIR);
    for (const [x, y] of hair) for (let z = -1; z <= 1; z++) put(x, y, z, HAIR);
  }
  return v;
}

function groundVoxels(style) {
  const v = new Map(), c = style === 'lego' ? '#237841' : '#5d9b3a';
  for (let x = -16; x <= 44; x++) for (let z = -10; z <= 10; z++) v.set(`${x},-10,${z}`, c);

}

// ---------- rendering ----------
const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.background = new THREE.Color('#8ec5ee');
scene.fog = new THREE.Fog('#8ec5ee', 80, 160);
const hemi = new THREE.HemisphereLight('#ffffff', '#3d5a2a', 1.6);

sun.position.set(25, 45, 30);

Object.assign(sun.shadow.camera, { left:-40, right:40, top:40, bottom:-40, near:1, far:150 });

// Day and night skies, shared by the menu backdrop and the 3D ride.
const SKY = {
  day: { bg:'#8ec5ee', fog:'#8ec5ee', hemi:['#ffffff', '#3d5a2a', 1.6], sun:['#fff4dd', 2.4] },
  night: { bg:'#070b1f', fog:'#0b1233', hemi:['#6f86c9', '#0b0f1a', 0.6], sun:['#9fb4ff', 0.7] },
};
function setSky(k, near, far) {
  const s = SKY[k];
  scene.background = new THREE.Color(s.bg);
  scene.fog = new THREE.Fog(s.fog, near, far);
  hemi.color.set(s.hemi[0]); hemi.groundColor.set(s.hemi[1]); hemi.intensity = s.hemi[2];
  sun.color.set(s.sun[0]); sun.intensity = s.sun[1];
}
function starField(n, radius) { // upper hemisphere of points, unaffected by fog
  const pos = [];
  for (let i = 0; i < n; i++) {
    const [u, v] = [Math.random() * Math.PI * 2, 0.05 + Math.random() * 0.9];
    const r = Math.sqrt(1 - v * v);
    pos.push(Math.cos(u) * r * radius, v * radius, Math.sin(u) * r * radius);
  }
  const g = new THREE.BufferGeometry().setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  return new THREE.Points(g, new THREE.PointsMaterial({ color:'#ffffff', size:2, sizeAttenuation:false, fog:false }));
}
// ---------- Menu backdrop: gradient sky, two voxel mountain ranges, sun and clouds by day, moon and stars by night ----------
const menuBg = new THREE.Group();
scene.add(menuBg);
const MENU = {
  day: { top:'#2f7fd0', horizon:'#d3ecf8', near:'#4f7a52', far:'#8fb0c4', ground:'#b3cf8f' },
  night: { top:'#02040f', horizon:'#26306a', near:'#1c2a3a', far:'#2c3a5e', ground:'#24304f' },
};
const skyTex = {};
function gradient(k) { // vertical sky gradient as a 2x256 texture
  if (skyTex[k]) return skyTex[k];
  const cv = Object.assign(document.createElement('canvas'), { width:2, height:256 }), ctx = cv.getContext('2d');
  const g = ctx.createLinearGradient(0, 0, 0, 256);
  g.addColorStop(0, MENU[k].top); g.addColorStop(0.75, MENU[k].horizon); g.addColorStop(1, MENU[k].horizon);
  ctx.fillStyle = g; ctx.fillRect(0, 0, 2, 256);
  const t = new THREE.CanvasTexture(cv);
  t.colorSpace = THREE.SRGBColorSpace;
  return (skyTex[k] = t);
}
const unitBox = new THREE.BoxGeometry(1, 1, 1);
// A ring of voxel columns; height is a sum of sines so peaks look irregular but stay seamless around the circle.
function range(radius, cell, base, amp, seed, mat) {
  const n = Math.round(Math.PI * 2 * radius / cell), cols = [];
  for (let i = 0; i < n; i++) {
    const a = i / n * Math.PI * 2;
    const hgt = base + amp * Math.max(0, Math.sin(a * 3 + seed) * 0.5 + Math.sin(a * 7 + seed * 2) * 0.3 + Math.sin(a * 13 + seed * 3) * 0.2 + 0.25);
    for (let y = 0; y < hgt; y += cell) cols.push([Math.cos(a) * radius, y + cell / 2, Math.sin(a) * radius, y + cell >= hgt && hgt > base + amp * 0.55]);
  }
  const rock = new THREE.InstancedMesh(unitBox, mat, cols.length), snow = new THREE.InstancedMesh(unitBox, new THREE.MeshLambertMaterial({ color:'#f4f7fb', fog:false }), cols.length);
  const m = new THREE.Matrix4();
  let [r, s] = [0, 0];
  for (const [x, y, z, cap] of cols) {
    m.makeScale(cell, cell, cell).setPosition(x, y - 12, z);
    if (cap) snow.setMatrixAt(s++, m); else rock.setMatrixAt(r++, m);
  }
  rock.count = r; snow.count = s;
  menuBg.add(rock, snow);
  return mat;
}
const nearMat = range(230, 6, 6, 26, 1.3, new THREE.MeshLambertMaterial({ fog:false }));
const farMat = range(340, 8, 12, 38, 4.1, new THREE.MeshLambertMaterial({ fog:false }));
// Ground the ranges stand on, so nothing floats.
const groundMat = new THREE.MeshLambertMaterial({ fog:false });
const ground = new THREE.Mesh(new THREE.CircleGeometry(420, 48), groundMat);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -12; // just under the garage plate (voxel y = -10)
menuBg.add(ground);
const sunDisc = new THREE.Mesh(new THREE.CircleGeometry(16, 32), new THREE.MeshBasicMaterial({ color:'#fff6c9', fog:false }));
const moonDisc = new THREE.Mesh(new THREE.CircleGeometry(11, 32), new THREE.MeshBasicMaterial({ color:'#f4f1de', fog:false }));
for (const d of [sunDisc, moonDisc]) { d.position.set(-230, 62, -300); d.lookAt(0, 0, 0); menuBg.add(d) }
const menuStars = starField(900, 450);
menuBg.add(menuStars);
// Blocky clouds drifting around the plate.
const clouds = new THREE.Group(), cloudMat = new THREE.MeshLambertMaterial({ color:'#ffffff', fog:false });
for (let c = 0; c < 9; c++) {
  const cl = new THREE.Group(), a = c / 9 * Math.PI * 2;
  for (let b = 0; b < 6; b++) {
    const box = new THREE.Mesh(unitBox, cloudMat);
    box.scale.set(14 + (b * 7) % 12, 6 + (b % 2) * 4, 10 + (b * 5) % 8);
    box.position.set((b - 2.5) * 9, (b % 3) * 3, ((b * 3) % 5 - 2) * 4);
    cl.add(box);
  }

}
menuBg.add(clouds);
function animateMenu(dt) {

}

// Menu backdrop follows the page theme.
function menuSky() {
  const dark = document.documentElement.dataset.theme !== 'light', k = dark ? 'night' : 'day';
  setSky(k, 80, 160);
  scene.background = gradient(k);
  scene.fog.color.set(MENU[k].horizon);
  if (dark) { hemi.intensity = 1.1; sun.intensity = 1.3 } // brighter moon: the garage bike must stay readable
  nearMat.color.set(MENU[k].near); farMat.color.set(MENU[k].far); groundMat.color.set(MENU[k].ground);
  cloudMat.color.set(dark ? '#3a4470' : '#ffffff');

  sunDisc.visible = !dark;

}

const camera = new THREE.PerspectiveCamera(38, 1, 0.1, 500);
camera.position.set(36, 22, 84); // frames bike + rider (head ~27 voxels up)
const controls = new OrbitControls(camera, canvas);
controls.target.set(0, 7, 0);
controls.enableDamping = true;
controls.autoRotateSpeed = 1.2;
controls.minDistance = 20;
controls.maxDistance = 110;
controls.maxPolarAngle = Math.PI * 0.49;

const hash = (x, y, z) => {
  let h = Math.imul(x, 374761393) ^ Math.imul(y, 668265263) ^ Math.imul(z, 1274126177);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
};

function instanced(vox, style, cast) {
  const lego = style === 'lego';
  const size = lego ? 0.94 : 1; // brick seams vs seamless cubes
  const mat = new THREE.MeshStandardMaterial({ roughness: lego ? 0.3 : 0.95 });
  const cells = [...vox].map(([k, hex]) => [k.split(',').map(Number), hex]);
  const box = new THREE.InstancedMesh(new THREE.BoxGeometry(size, size, size), mat, cells.length);
  const m = new THREE.Matrix4(), c = new THREE.Color();
  cells.forEach(([[x, y, z], hex], i) => {
    box.setMatrixAt(i, m.makeTranslation(x, y, z));
    c.set(hex);
    if (!lego) c.offsetHSL(0, 0, (hash(x, y, z) - 0.5) * 0.08); // Minecraft-ish texture noise
    box.setColorAt(i, c);
  });
  const meshes = [box];
  if (lego) {
    const tops = cells.filter(([[x, y, z]]) => !vox.has(`${x},${y + 1},${z}`));
    const studs = new THREE.InstancedMesh(new THREE.CylinderGeometry(0.3, 0.3, 0.2, 12), mat, tops.length);
    tops.forEach(([[x, y, z], hex], i) => {
      studs.setMatrixAt(i, m.makeTranslation(x, y + size / 2 + 0.1, z));
      studs.setColorAt(i, c.set(hex));
    });
    meshes.push(studs);
  }
  for (const o of meshes) { o.castShadow = cast; o.receiveShadow = true }
  return meshes;
}

// ---------- low-poly bike + rider: same side-view coordinates as the voxels (x forward, y up, z across) ----------
// Returns a group whose userData.tick(dt, rpm) turns the cranks and moves the legs with them.
function lowpolyBike(b) {
  const g = new THREE.Group(), mats = new Map(), UP = new THREE.Vector3(0, 1, 0);
  const mat = hex => mats.get(hex) ?? mats.set(hex, new THREE.MeshStandardMaterial({ color:hex, flatShading:true, roughness:0.65 })).get(hex);
  const add = (geo, hex, parent = g) => {
    const m = new THREE.Mesh(geo, mat(hex));
    m.castShadow = m.receiveShadow = true;
    parent.add(m);
    return m;
  };
  const V = (x, y, z = 0) => new THREE.Vector3(x, y, z);
  // A tapered cylinder of length 1 along y, stretched between two points by place(a, b).
  const limb = (r0, r1, hex, sides = 6, parent = g) => {
    const m = add(new THREE.CylinderGeometry(r1, r0, 1, sides), hex, parent);
    m.place = (a, c) => {
      const d = c.clone().sub(a), len = d.length();
      m.position.copy(a).addScaledVector(d, 0.5);
      m.scale.set(1, len, 1);
      m.quaternion.setFromUnitVectors(UP, d.divideScalar(len || 1));
      return m;
    };
    return m;
  };
  const tube = (a, c, r, hex, sides = 6, parent = g) => limb(r, r, hex, sides, parent).place(a, c);
  const ball = (p, r, hex, detail = 0, parent = g) => { const m = add(new THREE.IcosahedronGeometry(r, detail), hex, parent); m.position.copy(p); return m };
  const box = (p, [sx, sy, sz], hex, rz = 0, parent = g) => { const m = add(new THREE.BoxGeometry(sx, sy, sz), hex, parent); m.position.copy(p); m.rotation.z = rz; return m };

  const F = FRAMES[b.frameType] ?? FRAMES.road;
  const R = 9, FRONT = 28, BB = V(11, -2), SEAT = V(...F.seat), HT = V(...F.ht), HB = V(...F.hb);
  const [BX, BY] = [HT.x + 2, HT.y + 1];

  // Wheels: tire, rim (deeper with rimDepth), 16 laced spokes, hub.
  for (const hx of [0, FRONT]) {
    const tire = F.fatTires ? 1.1 : 0.7;
    add(new THREE.TorusGeometry(R - tire, tire, 6, 32), TIRE).position.x = hx;
    const depth = 0.4 + b.rimDepth * 0.55, rimR = R - tire * 2 - depth / 2;
    add(new THREE.TorusGeometry(rimR, depth / 2, 4, 32), b.rim).position.x = hx;
    for (let k = 0; k < 16; k++) {
      const a = k / 16 * Math.PI * 2, z = k % 2 ? 0.5 : -0.5;
      tube(V(hx, 0, z), V(hx + Math.cos(a) * (rimR - depth / 2), Math.sin(a) * (rimR - depth / 2)), 0.06, METAL, 3);
    }
    tube(V(hx, 0, -1.2), V(hx, 0, 1.2), 0.5, METAL, 8);
    if (F.fenders) {
      const f = add(new THREE.TorusGeometry(R + 1.2, 0.25, 3, 24, 2.4), METAL);
      f.position.x = hx; f.rotation.z = 0.35;
    }
  }

  // Frame.
  const r = F.thick ? 0.75 : 0.45;
  tube(SEAT, HT, r, b.frame); tube(BB, HB, r * 1.2, b.frame); tube(BB, SEAT, r, b.frame);
  tube(HB, HT.clone().add(V(-0.2, 0.6)), 0.6, b.accent, 8);
  const stays = F.lowStays ? BB.clone().lerp(SEAT, 0.6) : SEAT;
  for (const z of [-0.9, 0.9]) {
    tube(stays.clone().setZ(z * 0.5), V(0, 0, z), 0.28, b.frame);
    tube(BB.clone().setZ(z * 0.6), V(0, 0, z), 0.32, b.frame);
    tube(HB.clone().setZ(z * 0.4), V(FRONT, 0, z * 1.1), 0.35, b.accent);
  }
  if (F.lugs) for (const p of [SEAT, HT, HB, BB]) ball(p, 0.8, b.accent);
  tube(SEAT, V(6, 15.6), 0.32, METAL, 8); // seatpost
  box(V(5.8, 16.1), [5.5, 0.7, 1.7], b.saddle, -0.04);
  tube(HT, V(BX, BY), 0.4, METAL); // stem
  const tape = TIRE;
  if (b.bars === 'flat') {
    tube(V(BX, BY, -5), V(BX, BY, 5), 0.3, METAL, 8);
    for (const z of [-4.5, 4.5]) tube(V(BX, BY, z - 1), V(BX, BY, z + 1), 0.45, tape, 8);
  } else {
    tube(V(BX, BY, -3), V(BX, BY, 3), 0.3, METAL, 8);
    for (const z of [-3, 3]) {
      const path = b.bars === 'drop' ? [[0, 0], [1.4, 0.3], [2.4, -0.8], [2.2, -2.4], [0.8, -3]] : [[0, 0], [1.5, 0], [3, 1]];
      for (let i = 1; i < path.length; i++) tube(V(BX + path[i - 1][0], BY + path[i - 1][1], z), V(BX + path[i][0], BY + path[i][1], z), 0.35, tape, 6);
      if (b.bars === 'drop') box(V(BX + 1.6, BY + 0.7, z), [1.4, 1, 0.8], tape, -0.3); // hoods
    }
    if (b.bars === 'aero') for (const z of [-1, 1]) tube(V(BX, BY + 1, z), V(BX + 5, BY + 1, z), 0.25, METAL, 6);
  }

  // Drivetrain; the crank group spins around the bottom bracket.
  const ring = add(new THREE.TorusGeometry(3.6, 0.35, 4, 24), METAL); ring.position.copy(BB).setZ(1.4);
  add(new THREE.CylinderGeometry(1.8, 1.8, 0.8, 12), METAL).position.set(0, 0, 1.3);
  g.children.at(-1).rotation.x = Math.PI / 2;
  tube(V(BB.x, BB.y + 3.6, 1.4), V(0, 1.8, 1.3), 0.12, CHAIN, 3);
  tube(V(BB.x, BB.y - 3.6, 1.4), V(0, -1.8, 1.3), 0.12, CHAIN, 3);
  const crank = new THREE.Group();
  crank.position.copy(BB);
  g.add(crank);
  const ARM = 4.6;
  for (const [s, z] of [[1, 2.2], [-1, -2.2]]) {
    tube(V(0, 0, z * 0.6), V(s * ARM, 0, z), 0.35, METAL, 6, crank);
    box(V(s * ARM, 0, z * 1.45), [1.6, 0.4, 1.4], TIRE, 0, crank);
  }

  // Rider.
  let legs = [];
  if (b.rider) {
    const a = { ...DEFAULT_RIDER, jersey:b.frame, ...b }, helmet = a.helmet === 'on';
    const HIP = V(6.2, 17.2), SH = V(17.5, 23.2), HEAD = V(20.6, 26.2), hand = z => V(BX + 1.6, BY + 1.1, z);
    ball(HIP, 2.4, a.shorts, 1).scale.set(1.2, 1, 1.15);
    limb(2.5, 2.2, a.jersey, 7).place(V(6.8, 18.5), SH.clone().add(V(-0.5, -0.4)));
    for (const z of [-2.1, 2.1]) {
      const s = SH.clone().setZ(z), h = hand(z * 1.25), elbow = s.clone().lerp(h, 0.5).add(V(-0.6, -1.6, z * 0.15));
      ball(s, 1.25, a.jersey);
      tube(s, s.clone().lerp(elbow, 0.55), 0.95, a.jersey, 6); // short sleeve
      limb(0.8, 0.7, a.skin, 6).place(s.clone().lerp(elbow, 0.5), elbow);
      limb(0.7, 0.55, a.skin, 6).place(elbow, h);
      ball(h, 0.65, a.skin);
    }
    tube(V(18.6, 24), V(19.6, 25.2), 0.8, a.skin, 6); // neck
    ball(HEAD, 1.9, a.skin, 1).scale.set(1.1, 1, 0.95);
    if (helmet) {
      const hm = add(new THREE.SphereGeometry(2.2, 8, 5, 0, Math.PI * 2, 0, Math.PI / 2), a.helmetColor);
      hm.position.copy(HEAD).add(V(-0.2, 0.15)); hm.scale.set(1.3, 1, 1.05); hm.rotation.z = 0.2;
    } else if (a.hair !== 'bald') {
      const hr = add(new THREE.SphereGeometry(2.05, 8, 5, 0, Math.PI * 2, 0, Math.PI / 2), a.hairColor);
      hr.position.copy(HEAD).add(V(-0.25, 0.1)); hr.scale.set(1.15, 1, 1.02); hr.rotation.z = 0.45;
    }
    if (a.hair === 'long') limb(1.7, 1.3, a.hairColor, 6).place(HEAD.clone().add(V(-1.2, 0.6)), V(17.4, 22.2));
    if (a.hair === 'ponytail') { limb(0.7, 0.35, a.hairColor, 5).place(HEAD.clone().add(V(-1.8, 0.5)), V(16.2, 23.4)); ball(HEAD.clone().add(V(-1.9, 0.5)), 0.6, a.hairColor) }

    // Legs: thigh + shin solved from hip to pedal (two-bone, knee forward), shoe flat on the pedal.
    const L1 = 12.6, L2 = 11.8; // hip to ankle at the bottom of the stroke is ~23.5, keep a slight knee bend
    legs = [[1, 1.7], [-1, -1.7]].map(([s, z]) => ({
      s, z,
      thigh: limb(1.55, 1.15, a.shorts, 7), shin: limb(1.05, 0.7, a.skin, 6),
      knee: ball(V(0, 0), 1.1, a.skin), shoe: box(V(0, 0), [3.2, 1.1, 1.3], a.shoes),
    }));
    g.userData.legs = { HIP, L1, L2 };
  }

  let angle = -0.6;
  const pose = () => {
    crank.rotation.z = angle;
    for (const l of legs) {
      const { HIP, L1, L2 } = g.userData.legs;
      const pedal = BB.clone().add(V(Math.cos(angle) * ARM * l.s, Math.sin(angle) * ARM * l.s, l.z * 1.6));
      const ankle = pedal.clone().add(V(-0.4, 1.2)), hip = HIP.clone().setZ(l.z);
      const d = Math.min(ankle.distanceTo(hip), L1 + L2 - 0.01), dir = ankle.clone().sub(hip).normalize();
      const t = Math.acos(Math.min(1, (L1 * L1 + d * d - L2 * L2) / (2 * L1 * d)));
      const knee = hip.clone().add(dir.clone().applyAxisAngle(new THREE.Vector3(0, 0, 1), t).multiplyScalar(L1));
      l.thigh.place(hip, knee); l.shin.place(knee, ankle); l.knee.position.copy(knee);
      l.shoe.position.copy(pedal).add(V(0.3, 0.75));
    }
  };
  pose();
  g.userData.tick = (dt, rpm) => { angle -= dt * rpm / 60 * Math.PI * 2; pose() };
  return g;
}

// Pain cave for the low-poly garage: rubber mat, wheel-on trainer at the back, riser under the front wheel.
function painCave() {
  const g = new THREE.Group(), m = hex => new THREE.MeshStandardMaterial({ color:hex, flatShading:true, roughness:0.8 });
  const add = (geo, hex, [x, y, z]) => { const o = new THREE.Mesh(geo, m(hex)); o.position.set(x, y, z); o.castShadow = o.receiveShadow = true; g.add(o); return o };
  add(new THREE.BoxGeometry(62, 0.6, 26), '#2b2f36', [14, -9.8, 0]);
  add(new THREE.BoxGeometry(5, 1.4, 9), '#1b1e24', [28, -8.9, 0]); // front riser
  add(new THREE.CylinderGeometry(1.4, 1.4, 4, 10), '#1b1e24', [-1.8, -8.2, 0]).rotation.x = Math.PI / 2; // roller on the rear tire
  for (const s of [-1, 1]) for (const dx of [-5, 5]) { // A-frame from the rear hub to the floor
    const [a, c] = [new THREE.Vector3(0, 0, s * 1.6), new THREE.Vector3(dx, -9.4, s * 4.5)], d = c.clone().sub(a);
    const leg = add(new THREE.CylinderGeometry(0.45, 0.45, d.length(), 6), '#3a3f47', [0, 0, 0]);
    leg.position.copy(a).addScaledVector(d, 0.5);
    leg.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), d.normalize());
  }
  return g;
}

let world;
function draw(bike) {
  if (world) {
    scene.remove(world);
    world.traverse(o => { o.geometry?.dispose(); o.material?.dispose() });
  }
  world = new THREE.Group();
  const b = new THREE.Group();
  if (bike.style === 'lowpoly') {
    b.add(lowpolyBike({ ...bike, rider:true }), painCave());
    world.userData.tick = dt => b.children[0].userData.tick(dt, 80); // steady spin in the garage
  } else {
    b.add(...instanced(bikeVoxels({ ...bike, rider:true }), bike.style, true));
    world.add(...instanced(groundVoxels(bike.style), bike.style, false).map(g => (g.position.x = -14, g)));
  }
  b.position.x = -14; // center wheelbase on origin
  world.add(b);
  scene.add(world);
}

// Keep the bike centered in the area not covered by the garage panel.
function resize() {
  const [W, H] = [innerWidth, innerHeight];
  renderer.setSize(W, H, false);
  camera.aspect = W / H;
  camera.zoom = Math.min(1, camera.aspect * 1.3) * ($('#ride').hidden || w3.group ? 1 : 0.6); // portrait / ride panels: zoom out so the bike fits
  const [side, nav] = $('#garage').hidden ? [] : ['.side', '.garage-nav'].map(s => $(s).getBoundingClientRect());
  const narrow = W <= 700;
  // Center the bike between the left menu and the options panel (stacked at the bottom on narrow screens).
  if (side && narrow) camera.zoom *= 0.6; // only the strip above the bottom sheet is left for the bike
  if (side) camera.setViewOffset(W, H, narrow ? 0 : (side.width - nav.width) / 2, narrow ? (side.height + nav.height) / 2 : 0, W, H);
  else if (!$('#ride').hidden) {
    const [top, bottom] = [$('#stats'), $('.profile')].map(e => e.getBoundingClientRect().height);
    camera.setViewOffset(W, H, 0, (bottom - top) / 2, W, H);
  } else camera.clearViewOffset();
  if (!$('#ride').hidden && ride.course) drawProfile();
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
// Bike and ground tilt with the road; slope doubled so 8 % reads on screen.
let tilt = 0;
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.1);
  if (w3.group) update3d(dt);
  else {
    animateMenu(dt);
    world?.userData.tick?.(dt);
    const target = $('#ride').hidden ? 0 : Math.atan((ride.state?.grade ?? 0) / 100) * 2;
    tilt += (target - tilt) * 0.05;
    if (world) world.rotation.z = tilt;
    controls.update();
  }
  renderer.render(scene, camera);
  if (w3.mirror) renderMirror();
});

// ---------- UI ----------
const $ = s => document.querySelector(s);
function h(tag, props = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (k === 'style') e.style.cssText = v;
    else e.setAttribute(k, v);
  }
  e.append(...kids);
  return e;
}

// One screen at a time. Leaving the ride stops its stream, sound and 3D world.
const SCREENS = ['#profiles', '#home', '#profileEdit', '#garage', '#rideMenu', '#courses', '#free', '#training', '#ride'];
function show(id) {
  if (id !== '#ride') {
    exit3d();
    ride.events?.close();
    stopAmbience();
  }
  for (const sc of SCREENS) $(sc).hidden = sc !== id;
  $('#menu').hidden = true;
  controls.autoRotate = id !== '#garage';
  resize();
}

  'LK LR LS LT LU LV LY MA MC MD ME MF MG MH MK ML MM MN MO MP MQ MR MS MT MU MV MW MX MY MZ NA NC NE NF NG NI NL NO NP NR NU NZ OM PA PE PF ' +
  'PG PH PK PL PM PN PR PS PT PW PY QA RE RO RS RU RW SA SB SC SD SE SG SH SI SJ SK SL SM SN SO SR SS ST SV SX SY SZ TC TD TF TG TH TJ TK TL ' +
  'TM TN TO TR TT TV TW TZ UA UG UM US UY UZ VA VC VE VG VI VN VU WF WS YE YT ZA ZM ZW').split(' ');
const countryName = new Intl.DisplayNames(['fr'], { type:'region' });
// Regional-indicator emoji; platforms without flag glyphs show the two letters instead.
const flag = code => String.fromCodePoint(...[...code].map(c => 0x1F1E6 + c.charCodeAt(0) - 65));
const countryOptions = [h('option', { value:'' }, '—'), ...COUNTRY_CODES
  .map(code => [code, countryName.of(code)]).sort((a, b) => a[1].localeCompare(b[1], 'fr'))
  .map(([code, name]) => h('option', { value:code }, `${flag(code)} ${name}`))];

function showProfileEdit() {
  show('#profileEdit');
  const f = $('#editProfile').elements;
  [f.name.value, f.weight.value, f.ftp.value, f.country.value] = [current.name, current.weightKg, current.ftp, current.country ?? ''];
  const since = new Date(current.createdAt).toLocaleDateString('fr-FR', { day:'numeric', month:'long', year:'numeric' });
  $('#profileIdent').replaceChildren('Identifiant unique : ', h('code', {}, current.id), h('br'), `Créé le ${since}. Le nom est libre et peut être partagé, l'identifiant ne change jamais.`);
}

$('#editProfile').addEventListener('submit', e => {
  e.preventDefault();
  const f = new FormData(e.target);
  const name = f.get('name').trim();
  if (!name) return;
  Object.assign(current, { name, weightKg: +f.get('weight'), ftp: +f.get('ftp') });
  if (COUNTRY_CODES.includes(f.get('country'))) current.country = f.get('country');
  else delete current.country;
  persist();
  showHome();
});
$('#deleteProfile').addEventListener('click', () => {
  if (!confirm(`Supprimer le profil ${current.name} et ses ${current.history?.length ?? 0} sortie(s) ?`)) return;
  profiles = profiles.filter(q => q !== current);
  persist();
  showProfiles();
});
$('#profileBack').addEventListener('click', () => showHome());
$('#goProfile').addEventListener('click', showProfileEdit);

function showProfiles() {
  current = null;
  show('#profiles');
  draw(profiles.at(-1)?.bike ?? DEFAULT_BIKE);
  renderList();
}

function showHome(p = current) {
  current = p;
  show('#home');
  draw(p.bike);
  $('#homeAvatar').textContent = p.name[0].toUpperCase();
  $('#homeAvatar').style.background = p.bike.frame;
  $('#homeHello').textContent = `Salut ${p.name} !${p.country ? ` ${flag(p.country)}` : ''}`;
  $('#homeStats').textContent = `${p.weightKg} kg · FTP ${p.ftp} W · ${(p.ftp / p.weightKg).toFixed(1)} W/kg`;
  const n = ride.list?.courses.length ?? 0;
  $('#goRideSub').textContent = `${n} col${n > 1 ? 's' : ''} mythique${n > 1 ? 's' : ''} et le monde ouvert`;
  $('#goTrainSub').textContent = `${ride.workouts?.length ?? 0} séances calées sur ta FTP`;
  renderHistory();
  $('#homeMode').textContent = !ride.list ? '' : ride.list.trainer
    ? `Home trainer connecté : ${ride.list.trainer}`
    : 'Mode démo : pas de home trainer, tu règles les watts avec un curseur.';
}

function renderList() {
  $('#empty').hidden = profiles.length > 0;
  $('#list').replaceChildren(...profiles.map(p => h('div', {
      class:'card block', role:'button', tabindex:0,
      onclick: () => showHome(p),
      onkeydown: e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); showHome(p) } },
    },
    h('span', { class:'avatar', style:`background:${p.bike.frame}` }, p.name[0].toUpperCase()),
    h('div', { class:'meta' },
      h('strong', {}, `${p.name}${p.country ? ` ${flag(p.country)}` : ''}`),
      h('small', {}, `${p.weightKg} kg · ${p.ftp} W · ${(p.ftp / p.weightKg).toFixed(1)} W/kg`)),
    h('button', {
      class:'del', title:'Supprimer', 'aria-label':`Supprimer ${p.name}`,
      onclick: e => {
        e.stopPropagation();
        if (!confirm(`Supprimer le profil ${p.name} ?`)) return;
        profiles = profiles.filter(q => q !== p);
        persist();
        showProfiles();
      },
    }, '×'),
  )));
}

$('#new').addEventListener('submit', e => {
  e.preventDefault();
  const f = new FormData(e.target);
  const name = f.get('name').trim();
  if (!name) return;
  const colors = Object.values(PALETTE);
  const p = {
    id: newId(),
    createdAt: new Date().toISOString(),
    name, weightKg: +f.get('weight'), ftp: +f.get('ftp'),
    ...(COUNTRY_CODES.includes(f.get('country')) && { country: f.get('country') }),
    bike: { ...DEFAULT_BIKE, frame: colors[profiles.length % colors.length] },
  };
  profiles.push(p);
  persist();
  e.target.reset();
  showHome(p);
});

function openGarage() {
  show('#garage');
  $('#who').textContent = current.name;
  renderOptions();
  draw(current.bike);
}

let garageTab = 'bike';
for (const btn of document.querySelectorAll('.garage-nav .btn')) btn.addEventListener('click', () => { garageTab = btn.dataset.tab; renderOptions() });

function renderOptions() {
  const b = { ...DEFAULT_RIDER, jersey:current.bike.frame, ...current.bike };
  for (const btn of document.querySelectorAll('.garage-nav .btn')) {
    btn.classList.toggle('on', btn.dataset.tab === garageTab);
    btn.setAttribute('aria-pressed', btn.dataset.tab === garageTab);
  }
  $('#options').replaceChildren(...OPTIONS.filter(o => (o.tab ?? 'bike') === garageTab).map(o => h('fieldset', { class:'opt' },
    h('legend', {}, o.label),
    o.colors
      ? h('div', { class:'swatches' }, ...Object.entries(o.colors === true ? PALETTE : o.colors).map(([name, hex]) => h('button', {
          class: 'sw' + (b[o.key] === hex ? ' on' : ''), style:`background:${hex}`,
          title:name, 'aria-label':`${o.label} : ${name}`, 'aria-pressed': b[o.key] === hex,
          onclick: () => set(o.key, hex),
        })))
      : h('div', { class:'seg' }, ...o.choices.map(([val, label]) => h('button', {
          class: b[o.key] === val ? 'on' : '', 'aria-pressed': b[o.key] === val,
          onclick: () => set(o.key, val),
        }, label))),
  )));
}

function set(key, val) {
  current.bike[key] = val;
  persist();
  renderOptions();
  draw(current.bike);
}

// ---------- ride (live from the Rust engine: `le-mollet ride`) ----------
const ride = { list:null, workouts:null, mode:'course', course:null, workout:null, state:null, events:null, session:0, auto:false, ended:false };
const GRADE_COLORS = [[0, '#36aebf'], [3, '#5d9b3a'], [6, '#f2cd37'], [9, '#fe8a18'], [12, '#c91a09'], [Infinity, '#7a0c0c']];
const gradeColor = g => GRADE_COLORS.find(([max]) => g < max)[1];

// Elevation thumbnail filled in the accent color.
function sparkline(cv, prof) {
  const [W, H] = [cv.clientWidth, cv.clientHeight], dpr = Math.min(devicePixelRatio, 2);
  cv.width = W * dpr; cv.height = H * dpr;
  const ctx = cv.getContext('2d');
  ctx.scale(dpr, dpr);
  const lo = Math.min(...prof), hi = Math.max(...prof);
  ctx.fillStyle = '#f2cd37';
  ctx.beginPath();
  ctx.moveTo(0, H);
  prof.forEach((e, i) => ctx.lineTo(i / (prof.length - 1) * W, H - 2 - (e - lo) / (hi - lo || 1) * (H - 4)));
  ctx.lineTo(W, H);
  ctx.fill();
}

async function renderWorlds() {
  const worlds = await fetch('/worlds').then(r => r.json()).catch(() => []);
  $('#worldList').replaceChildren(...worlds.map(w => {
    const cv = h('canvas', { 'aria-hidden':'true' });
    const card = h('div', {
        class:'workout-card block', role:'button', tabindex:0,
        onclick: () => openRide(w.id, true),
        onkeydown: e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openRide(w.id, true) } },
      },
      h('div', { class:'row' }, h('strong', {}, w.name),
        h('small', { class: w.riders ? 'online' : '' }, w.riders ? `${w.riders} cycliste${w.riders > 1 ? 's' : ''} en ligne` : 'personne pour l\'instant')),
      h('small', {}, `${(w.length / 1000).toFixed(1)} km · +${w.gain} m par tour · ${w.relief}`),
      cv);
    requestAnimationFrame(() => sparkline(cv, w.profile));
    return card;
  }));
}

// Souvenir-magnet postcard: sky, a far ridge, the climb's real profile as the mountain, snow on top.
function magnetArt(cv, prof, t) {
  const [W, H] = [cv.clientWidth, cv.clientHeight], dpr = Math.min(devicePixelRatio, 2);
  cv.width = W * dpr; cv.height = H * dpr;
  const ctx = cv.getContext('2d');
  ctx.scale(dpr, dpr);
  const sky = ctx.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, t.sky[0]); sky.addColorStop(1, t.sky[1]);
  ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#fff6c9'; ctx.beginPath(); ctx.arc(W * 0.2, H * 0.22, 14, 0, 7); ctx.fill();
  const lo = Math.min(...prof), hi = Math.max(...prof);
  const y = (e, top, bottom) => bottom - (e - lo) / (hi - lo || 1) * (bottom - top);
  const ridge = (color, top, bottom) => {
    ctx.fillStyle = color; ctx.beginPath(); ctx.moveTo(0, H);
    prof.forEach((e, i) => ctx.lineTo(i / (prof.length - 1) * W, y(e, top, bottom)));
    ctx.lineTo(W, H); ctx.fill();
  };
  ridge(t.far, H * 0.25, H * 0.7); // far ridges: the same profile, and mirrored
  ctx.save(); ctx.translate(W, 0); ctx.scale(-1, 1); ridge(t.far, H * 0.3, H * 0.72); ctx.restore();
  ridge(t.near, H * 0.28, H * 0.86);
  // Snow cap above 80 % of the climb height.
  ctx.fillStyle = '#ffffff'; ctx.beginPath();
  const snow = H * 0.28 + (H * 0.86 - H * 0.28) * 0.2;
  prof.forEach((e, i) => { const yy = y(e, H * 0.28, H * 0.86); ctx[i ? 'lineTo' : 'moveTo'](i / (prof.length - 1) * W, Math.min(yy, snow)) });
  ctx.lineTo(W, snow); ctx.lineTo(0, snow); ctx.fill();
}

// ---------- training ----------
const ZONES = [[55, '#9aa4b2'], [76, '#36aebf'], [90, '#5d9b3a'], [105, '#f2cd37'], [119, '#fe8a18'], [Infinity, '#c91a09']];
const zoneColor = pct => ZONES.find(([max]) => pct < max)[1];
const mmss = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;

function showTraining() {

  $('#trainingHint').textContent = ride.list?.trainer

    : `Mode démo : suis la cible au curseur, ou laisse le pilote auto. Cibles calculées sur ta FTP de ${current.ftp} W.`;
  $('#workoutList').replaceChildren(...ride.workouts.map(({ w, duration }) => {
