[package]
name = "le-mollet"
version.workspace = true
edition = "2024"
description = "Open-source indoor cycling engine: smart trainer control over BLE"
license = "PolyForm-Noncommercial-1.0.0"

[dependencies]
btleplug = "0.11"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "time", "net", "signal", "sync"] }
futures = "0.3"
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
# ponytail: vendored libdbus so build works without libdbus-1-dev installed
dbus = { version = "0.9", features = ["vendored"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# decode the IGN aerial photo for decor (src/decor.rs)
jpeg-decoder = { version = "0.3", default-features = false }
# decode elevation tiles outside France (src/dem.rs)
png = "0.17"
flate2 = "1.1"
ureq = { version = "2", features = ["json"] }
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.41.0", features = ["bundled"] }
argon2 = "0.6.0"
# the sign-up proof of work (src/account.rs)
sha2 = "0.10"

[workspace]
members = ["client"]

# The version commitizen bumps (`cz bump`, see docs/CONTRIBUTING.md "Releasing"); the package inherits it.
[workspace.package]
version = "0.2.0"

# Bevy is unusable unoptimized: optimize dependencies even in dev builds.
[profile.dev.package."*"]
opt-level = 3
