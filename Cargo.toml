[package]
name = "le-mollet"
version.workspace = true
edition = "2024"
description = "Source-available multiplayer indoor cycling game: smart trainer control over BLE, a Lego world in the browser"
license = "PolyForm-Noncommercial-1.0.0"

[dependencies]
btleplug = "0.11"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "time", "net", "signal", "sync"] }
futures = "0.3"
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# decode the IGN aerial photo for decor (src/decor.rs)
jpeg-decoder = { version = "0.3", default-features = false }
# decode elevation tiles outside France (src/dem.rs)
png = "0.17"
flate2 = "1.1"
ureq = { version = "2", features = ["json"] }
clap = { version = "4", features = ["derive"] }
# 0.32: the libsqlite3-sys that torii's sqlx storage links too (one native SQLite per binary)
rusqlite = { version = "0.32", features = ["bundled"] }
# accounts, sessions, magic links and passwords (src/account.rs)
torii = { version = "0.5.3", default-features = false, features = ["sqlite", "magic-link", "password"] }
torii-core = "0.5.2"
async-trait = "0.1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "chrono", "uuid"] }
chrono = "0.4"
# the sign-up proof of work (src/account.rs)
sha2 = "0.10"
# sign-in links by e-mail (src/mail.rs)
lettre = { version = "0.11.23", default-features = false, features = ["smtp-transport", "builder", "rustls-tls", "webpki-roots"] }

[workspace]
members = ["client"]

# The version commitizen bumps (`cz bump`, see docs/CONTRIBUTING.md "Releasing"); the package inherits it.
[workspace.package]
version = "0.4.0"

# Bevy is unusable unoptimized: optimize dependencies even in dev builds.
[profile.dev.package."*"]
opt-level = 3

# Linux only: btleplug speaks to BlueZ over D-Bus; libdbus vendored so a build needs no libdbus-1-dev.
[target.'cfg(target_os = "linux")'.dependencies]
dbus = { version = "0.9", features = ["vendored"] }
